<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Журнал групп</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  main{min-height:100vh;display:grid;place-items:center;padding:16px}
  form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:20px;margin:0}
  input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;font:inherit;color:inherit;width:100%}
  .err{color:var(--miss);font-size:14px;margin:0;min-height:1em}
  .btn{justify-content:center}
</style>
</head>
<body>
<main>
  <form id="f">
    <h1>Журнал групп</h1>
    <label class="flabel" for="pw">Пароль учителя</label>
    <input type="password" id="pw" autocomplete="current-password" required autofocus>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" type="submit">Войти</button>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var err = document.getElementById('err'); err.textContent = '';
  try {
    var r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) });
    var j = await r.json().catch(function () { return {}; });
    if (r.ok) location.href = '/t/'; else err.textContent = j.error || 'Не получилось войти.';
  } catch (x) { err.textContent = 'Нет связи с сайтом. Проверьте интернет.'; }
});
</script>
</body>
</html>
