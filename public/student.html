<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Личный кабинет</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/base.css">
<style>
/* Layout: шапка с именем и вкладками; на главной — домашка и долги, дальше уроки карточками */
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
.top h1{font-size:22px;margin:0}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;position:sticky;top:8px;z-index:3}
.tabs a{flex:1;text-align:center;padding:8px 10px;border-radius:7px;color:var(--muted);text-decoration:none;font-weight:600}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--on-ink)}
h2{font-size:16px;margin:0 0 10px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.empty{color:var(--muted)}
.hw-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hw-text a{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.part{background:var(--part-soft);color:var(--part)}
.chip.none{background:var(--miss-soft);color:var(--miss)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.chip.star{background:var(--ink-soft);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.due{font-size:14px;color:var(--muted);margin:2px 0 10px}
.home-hw{border-left:4px solid var(--ink)}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px 4px 4px;color:var(--text);text-decoration:none;font-size:14px;max-width:100%;cursor:pointer;font:inherit;text-align:left}
.file:hover{border-color:var(--ink)}
.file img{width:40px;height:40px;object-fit:cover;border-radius:5px;display:block}
.file .ext{width:40px;height:40px;border-radius:5px;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;text-transform:uppercase;flex:none}
.file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:70px;transition:box-shadow .3s}
.lesson.flash{box-shadow:0 0 0 3px var(--ink-soft)}
.l-date{font-family:var(--font-display);font-weight:500;font-size:16px}
.l-topic{font-weight:500;margin-top:2px}
.l-marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rec{background:var(--ink-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rec .files{margin-top:0}
.rec-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.vid{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px 6px 6px;color:var(--text);text-decoration:none;font-weight:600}
.vid:hover{border-color:var(--ink)}
.vid-ico{width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px}
.vid-host{font-weight:400;color:var(--muted);font-size:13px}
.hw{background:var(--paper);border-radius:8px;padding:10px 12px}
.list{display:flex;flex-direction:column;gap:12px}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;flex:1;min-width:180px}
/* статистика */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.t-label{font-size:13px;color:var(--muted)}
.t-val{font-family:var(--font-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.t-avg{font-size:13px;color:var(--muted)}
.s-row{display:grid;grid-template-columns:minmax(130px,180px) 1fr 52px auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.s-row:first-of-type{border-top:none}
.s-label{font-size:14px;font-weight:500;display:flex;flex-direction:column}
.s-detail{font-size:12px;color:var(--muted);font-weight:400}
.bar{position:relative;height:12px;background:var(--wait-soft);border-radius:6px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.f-att{background:var(--ok)} .f-hw{background:var(--ink)} .f-ok{background:var(--part)}
.bar-avg{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text);border-radius:1px}
.s-val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.diff{font-size:13px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.diff.up{background:var(--ok-soft);color:var(--ok)} .diff.down{background:var(--miss-soft);color:var(--miss)} .diff.same{background:var(--wait-soft);color:var(--wait)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hwsub{border:1px dashed var(--ink);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.hwsub .label{margin:0}
.sub-st{margin:0;font-size:14px;color:var(--muted)}
.sub-st b{color:var(--ok)}
.sub-c{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.hwsub .files{margin-top:0}
.sub-f{position:relative;display:inline-flex}
.sub-x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--miss);cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}
.sub-act{display:flex;gap:8px;flex-wrap:wrap}
.hwsub.drop{background:var(--ink-soft)}
@media (hover:none){.desk-only{display:none}}
.sub-act label.btn{cursor:pointer}
.sub-cbox{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sub-cbox[hidden]{display:none}
.sub-cbox textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;resize:vertical}
.err{color:var(--miss);font-size:14px;margin:0}
/* редактор фото */
.ed{position:fixed;inset:0;z-index:30;background:#0d1118;color:#e9edf5;display:flex;flex-direction:column;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.ed-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-count{font-weight:600}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#ed-c{touch-action:none;display:block;cursor:crosshair}
.ed-hint{margin:0;font-size:13px;color:#aab3c4;text-align:center}
.ed-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ed-b{border:1px solid #39435a;background:#1a2130;color:#e9edf5;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.ed-b[aria-pressed="true"]{background:#e9edf5;color:#0d1118}
.ed-b.danger{color:#ff8a6c}
.ed-nav{display:flex;justify-content:space-between;gap:10px}
.ed .btn.ghost{background:transparent;color:#e9edf5;border-color:#39435a}
.err:empty{display:none}
.per{display:flex;flex-wrap:wrap;gap:6px}
.per-b{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.per-b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
/* просмотр картинок */
.viewer{position:fixed;inset:0;background:rgba(10,14,22,.94);z-index:20;display:flex;flex-direction:column}
.v-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface)}
.v-name{font-weight:600;overflow-wrap:anywhere;min-width:0;flex:1}
.v-body{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.v-body img{max-width:100%;height:auto;border-radius:6px;background:#fff}
@media (max-width:600px){
  .tiles{gap:6px} .tile{padding:8px} .t-val{font-size:20px}
  .s-row{grid-template-columns:1fr 46px auto;gap:6px 10px} .s-label{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="panel empty">Загружаю кабинет…</div></main>
<div id="viewer"></div>
<div id="editor"></div>
<script>
(function(){
"use strict";
var TOKEN=(location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)/)||[])[1];
var D=null, VIEW="home", PER="all";
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(s){var p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
var fLong=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"}), fWd=new Intl.DateTimeFormat("ru-RU",{weekday:"short"});
function fmtLong(s){var d=parseD(s);return fLong.format(d)+", "+fWd.format(d);}
function fmtDay(s){return fLong.format(parseD(s));}
function plural(n,a,b,c){var m=n%10,k=n%100;if(m===1&&k!==11)return a;if(m>=2&&m<=4&&(k<12||k>14))return b;return c;}
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,function(u){var clean=u.replace(/[.,;:!?)]+$/,"");return '<a href="'+clean+'" target="_blank" rel="noopener noreferrer">'+clean+'</a>'+u.slice(clean.length);});}
function hostOf(u){var m=/^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(u||"");return m?m[1]:"";}
function extOf(n){var m=/\.([a-z0-9]{1,5})$/i.exec(n||"");return m?m[1]:"файл";}

function hwState(l){var v=l.mark.hw;return v==="done"||v==="part"||v==="none"?v:"wait";}
var HW_TXT={done:"Сдано",part:"Сдано частично",none:"Не сдано",wait:"Ждём домашку"};
function hwLabel(l){var st=hwState(l);return st==="wait"&&l.sub&&l.sub.files&&l.sub.files.length?"Отправлено, на проверке":HW_TXT[st];}

/* ---------- данные ---------- */
function load(){
  fetch("/api/s/"+TOKEN,{credentials:"omit"}).then(function(r){
    if(r.status===404)throw new Error("notfound");
    if(!r.ok)throw new Error("fail");
    return r.json();
  }).then(function(j){
    D=j; D.lessons.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    document.title="Кабинет — "+D.student.name;
    route();
  }).catch(function(e){
    $("#app").innerHTML='<div class="panel empty">'+(e.message==="notfound"?"Ссылка больше не работает. Попросите у преподавателя новую.":"Не получилось загрузить кабинет. Проверьте интернет и обновите страницу.")+'</div>';
  });
}

/* ---------- части страницы ---------- */
function fileBtn(f){
  var img=/^image\//.test(f.type||""), url=f.url||("/_blob/"+f.id);
  if(img)return '<button type="button" class="file" data-img="'+esc(url)+'" data-name="'+esc(f.name)+'"><img src="'+esc(url)+'" alt=""><span class="fname">'+esc(f.name)+'</span></button>';
  return '<a class="file" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span class="ext">'+esc(extOf(f.name))+'</span><span class="fname">'+esc(f.name)+'</span></a>';
}
function files(list){return list&&list.length?'<div class="files">'+list.map(fileBtn).join("")+'</div>':"";}
function scoreChip(l){
  var o=l.mark.ok; if(typeof o!=="number"||!l.count)return "";
  var r=o/l.count, cls=r>1?"star":r>=1?"done":r>=.5?"part":"none";
  return '<span class="chip '+cls+'">Верно '+o+' из '+l.count+(r>1?" ★":"")+'</span>';
}
function marks(l){
  var h="";
  if(l.mark.att==="y")h+='<span class="chip done">Был на занятии</span>';
  else if(l.mark.att==="n")h+='<span class="chip none">Не был</span>';
  if(!l.noHw){var st=hwState(l);h+='<span class="chip '+st+'">'+hwLabel(l)+'</span>'+scoreChip(l);}
  return h?'<div class="l-marks">'+h+'</div>':"";
}
function rec(l){
  if(!l.video&&!(l.board&&l.board.length))return "";
  return '<div class="rec"><div class="label">Запись занятия</div>'+
    (l.video?'<a class="vid" href="'+esc(l.video)+'" target="_blank" rel="noopener noreferrer"><span class="vid-ico" aria-hidden="true">▶</span>Смотреть видео<span class="vid-host">'+esc(hostOf(l.video))+'</span></a>':"")+
    (l.board&&l.board.length?'<div class="rec-sub">Записи с доски</div>'+files(l.board):"")+'</div>';
}
function hwBlock(l){
  if(l.noHw)return '<div class="hw"><p class="hw-text muted">Домашку не задавали</p></div>';
  return '<div class="hw"><div class="label">Домашнее задание'+(l.count?" · "+l.count+" "+plural(l.count,"номер","номера","номеров"):"")+'</div>'+
    (l.hw?'<p class="hw-text">'+linkify(l.hw)+'</p>':(l.files&&l.files.length?"":'<p class="hw-text muted">Текст задания не записан</p>'))+files(l.files)+'</div>';
}
function lessonCard(l){
  return '<article class="lesson" id="l-'+esc(l.id)+'"><div><div class="l-date">'+esc(fmtLong(l.date))+'</div>'+
    (l.topic?'<div class="l-topic">'+esc(l.topic)+'</div>':"")+marks(l)+'</div>'+rec(l)+hwBlock(l)+subBlock(l)+'</article>';
}
var fTime=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
var UP={}; // идёт загрузка: lessonId -> текст
function subBlock(l){
  if(l.noHw)return "";
  var sub=l.sub, graded=!!l.mark.hw, files=(sub&&sub.files)||[];
  var h='<div class="hwsub" id="sub-'+esc(l.id)+'"><div class="label">Моё решение</div>';
  if(files.length||(sub&&sub.comment)){
    h+='<p class="sub-st">Отправлено '+esc(fTime.format(new Date(sub.updated)))+' · '+
      (graded?'<b>проверено</b>':sub.seen?'преподаватель посмотрел':'ждёт проверки')+'</p>';
    if(files.length)h+='<div class="files">'+files.map(function(f){
      return '<span class="sub-f">'+fileBtn(f)+(graded?'':'<button type="button" class="sub-x" data-rm="'+esc(f.id)+'" data-l="'+esc(l.id)+'" aria-label="Удалить '+esc(f.name)+'" title="Удалить">×</button>')+'</span>';
    }).join("")+'</div>';
    if(sub.comment)h+='<p class="sub-c">Комментарий: '+esc(sub.comment)+'</p>';
  }
  if(UP[l.id])h+='<p class="sub-st" id="prog-'+esc(l.id)+'">'+esc(UP[l.id])+'</p>';
  else{
    h+='<div class="sub-act"><label class="btn" for="up-'+esc(l.id)+'">'+(files.length?'Добавить ещё фото':'Отправить решение')+'</label>'+
      '<input type="file" id="up-'+esc(l.id)+'" data-up="'+esc(l.id)+'" multiple accept="image/*,application/pdf" hidden>'+
      '<button type="button" class="btn ghost" data-cmt="'+esc(l.id)+'">'+(sub&&sub.comment?'Изменить комментарий':'Комментарий')+'</button></div>'+
      '<div class="sub-cbox" id="cbox-'+esc(l.id)+'" hidden><textarea id="ct-'+esc(l.id)+'" rows="3" placeholder="Например: в №3 не понял, как начать">'+esc((sub&&sub.comment)||"")+'</textarea>'+
      '<button type="button" class="btn" data-csave="'+esc(l.id)+'">Отправить комментарий</button></div>';
    if(!files.length)h+='<p class="hint">Сфотографируйте решение в тетради или выберите фото из галереи. Можно сразу несколько.<span class="desk-only"> С компьютера можно вставить картинку через Ctrl+V или перетащить файл сюда мышкой.</span></p>';
  }
  return h+'<p class="err" id="err-'+esc(l.id)+'" role="alert"></p></div>';
}
function api(path,body,headers){
  return fetch("/api/s/"+TOKEN+path,{method:"POST",credentials:"omit",headers:headers||{"Content-Type":"application/json"},body:body}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||"Ошибка "+r.status);return j;});
  },function(){throw new Error("Нет связи с сайтом. Проверьте интернет.");});
}
function compress(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return Promise.resolve(file);
  return new Promise(function(res){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=2000, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*k); h=Math.round(h*k);
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      var x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){
        if(!b||b.size>=file.size)return res(file);
        res(new File([b],(file.name||"фото").replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}));
      },"image/jpeg",0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
function findL(id){for(var i=0;i<D.lessons.length;i++)if(D.lessons[i].id===id)return D.lessons[i];return null;}
function keepScroll(fn){var y=window.scrollY;fn();window.scrollTo(0,y);}
function showErr(lid,t){var e=document.getElementById("err-"+lid);if(e)e.textContent=t||"";}
function sendFiles(lid,list,prepared){
  var files=Array.prototype.slice.call(list,0,20), ids=[], done=0, failed=null;
  if(!files.length)return;
  UP[lid]="Загружаю фото: 0 из "+files.length+"…"; keepScroll(render);
  var chain=Promise.resolve();
  files.forEach(function(f){
    chain=chain.then(function(){return prepared?f:compress(f);}).then(function(cf){
      if(cf.size>20*1024*1024)throw new Error("«"+f.name+"» больше 20 МБ.");
      return api("/upload",cf,{"Content-Type":cf.type||"application/octet-stream","X-Filename":encodeURIComponent(cf.name||"фото")});
    }).then(function(r){ids.push(r.id);},function(e){failed=failed||e.message;}).then(function(){
      done++; UP[lid]="Загружаю фото: "+done+" из "+files.length+"…";
      var st=document.getElementById("prog-"+lid); if(st)st.textContent=UP[lid];
    });
  });
  chain.then(function(){
    if(!ids.length)throw new Error(failed||"Не получилось загрузить фото.");
    return api("/submit",JSON.stringify({lessonId:lid,files:ids}));
  }).then(function(r){var l=findL(lid);if(l)l.sub=r.sub;delete UP[lid];keepScroll(render);if(failed)showErr(lid,"Часть файлов не загрузилась: "+failed);},
    function(e){delete UP[lid];keepScroll(render);showErr(lid,e.message);});
}
function nextLessonAfter(l){
  var later=D.lessons.filter(function(x){return x.groupId===l.groupId&&x.date>l.date;});
  return later.length?later[later.length-1]:null;
}

/* ---------- экраны ---------- */
function renderHome(){
  var td=today(), withHw=D.lessons.filter(function(l){return !l.noHw;});
  var cur=withHw.filter(function(l){return l.date<=td;})[0]||withHw[withHw.length-1];
  var h="";
  if(cur){
    var nx=nextLessonAfter(cur), st=hwState(cur);
    h+='<section class="panel home-hw"><h2>Домашка</h2><div class="due">Задано '+esc(fmtDay(cur.date))+(nx?", сдать к "+esc(fmtDay(nx.date)):", сдать к следующему занятию")+
      (cur.topic?" · "+esc(cur.topic):"")+'</div>'+
      '<div class="chips" style="margin-bottom:10px"><span class="chip '+st+'">'+hwLabel(cur)+'</span>'+scoreChip(cur)+'</div>'+
      (cur.hw?'<p class="hw-text">'+linkify(cur.hw)+'</p>':"")+files(cur.files)+subBlock(cur)+'</section>';
  }
  var debts=withHw.filter(function(l){return l!==cur&&hwState(l)!=="done"&&l.date<=td;});
  h+='<section class="panel"><h2>Не сдано</h2>'+(debts.length?'<div class="chips">'+debts.map(function(l){
      var st=hwState(l), sent=st==="wait"&&l.sub&&l.sub.files&&l.sub.files.length;

function loadImg(file){

    var url=URL.createObjectURL(file), img=new Image();

function openEditor(lid,list){

    var items=[];
    loaded.forEach(function(img,k){if(img)items.push({file:imgs[k],img:img,rot:0,crop:{x:0,y:0,w:1,h:1},scan:false});else extra.push(imgs[k]);});

function rotDims(it){var w=it.img.naturalWidth,h=it.img.naturalHeight;return it.rot%180?{w:h,h:w}:{w:w,h:h};}
function drawRotated(ctx,it,k){

  ctx.save();

  else if(it.rot===270){ctx.translate(0,ch);ctx.rotate(-Math.PI/2);}
  ctx.drawImage(it.img,0,0,w0,h0);
  ctx.restore();
}
/* режим «как скан»: убираем тени и серый фон, почерк делаем контрастнее */
function scanFilter(canvas){
  var w=canvas.width, h=canvas.height, ctx=canvas.getContext("2d");
  var sw=Math.max(8,Math.round(w/24)), sh=Math.max(8,Math.round(h/24));
  var small=document.createElement("canvas"); small.width=sw; small.height=sh;
  var sx=small.getContext("2d"); sx.imageSmoothingQuality="high"; sx.drawImage(canvas,0,0,sw,sh);

  var bx=bgc.getContext("2d"); bx.imageSmoothingEnabled=true; bx.imageSmoothingQuality="high"; bx.drawImage(small,0,0,w,h);
  var src=ctx.getImageData(0,0,w,h), bg=bx.getImageData(0,0,w,h).data, d=src.data;

function editorBase(){
  var it=ED.items[ED.i], rd=rotDims(it);
  var stage=$("#ed-stage"); if(!stage)return;
  var maxW=stage.clientWidth-8, maxH=stage.clientHeight-8;
  var k=Math.min(maxW/rd.w,maxH/rd.h,1), dpr=window.devicePixelRatio||1;
  var dw=Math.max(40,Math.floor(rd.w*k)), dh=Math.max(40,Math.floor(rd.h*k));
  var base=document.createElement("canvas"); base.width=Math.round(dw*dpr); base.height=Math.round(dh*dpr);
  drawRotated(base.getContext("2d"),it,base.width/rd.w);

function editorPaint(){
  var c=$("#ed-c"); if(!c||!ED.base)return;
  var it=ED.items[ED.i], x=c.getContext("2d"), W=c.width, H=c.height, dpr=ED.disp.dpr;
  var r={x:it.crop.x*W,y:it.crop.y*H,w:it.crop.w*W,h:it.crop.h*H};
  x.clearRect(0,0,W,H); x.drawImage(ED.base,0,0);
  x.fillStyle="rgba(10,14,22,.55)";
  x.fillRect(0,0,W,r.y); x.fillRect(0,r.y+r.h,W,H-r.y-r.h); x.fillRect(0,r.y,r.x,r.h); x.fillRect(r.x+r.w,r.y,W-r.x-r.w,r.h);
  x.strokeStyle="#fff"; x.lineWidth=2*dpr; x.strokeRect(r.x,r.y,r.w,r.h);
  var L=22*dpr, t=5*dpr; x.fillStyle="#fff";
  [[r.x,r.y,1,1],[r.x+r.w,r.y,-1,1],[r.x,r.y+r.h,1,-1],[r.x+r.w,r.y+r.h,-1,-1]].forEach(function(q){
    x.fillRect(q[2]>0?q[0]-t/2:q[0]-L+t/2,q[3]>0?q[1]-t/2:q[1]-t/2,L,t);
    x.fillRect(q[2]>0?q[0]-t/2:q[0]-t/2,q[3]>0?q[1]-t/2:q[1]-L+t/2,t,L);

}
var DRAG=null;
function edPoint(e){var c=$("#ed-c"),b=c.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width,y:(e.clientY-b.top)/b.height,bw:b.width,bh:b.height};}
function edDown(e){
  if(!ED||e.target.id!=="ed-c")return;
  var p=edPoint(e), cr=ED.items[ED.i].crop, tx=26/p.bw, ty=26/p.bh;
  var corners={tl:[cr.x,cr.y],tr:[cr.x+cr.w,cr.y],bl:[cr.x,cr.y+cr.h],br:[cr.x+cr.w,cr.y+cr.h]}, hit=null;
  Object.keys(corners).forEach(function(k){var q=corners[k];if(!hit&&Math.abs(p.x-q[0])<tx&&Math.abs(p.y-q[1])<ty)hit=k;});
  if(!hit&&p.x>cr.x&&p.x<cr.x+cr.w&&p.y>cr.y&&p.y<cr.y+cr.h)hit="move";
  if(!hit)return;
  DRAG={k:hit,p:p,c:{x:cr.x,y:cr.y,w:cr.w,h:cr.h}};
  e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function edMove(e){
  if(!DRAG||!ED)return;
  var p=edPoint(e), dx=p.x-DRAG.p.x, dy=p.y-DRAG.p.y, s=DRAG.c, m=0.06, n={x:s.x,y:s.y,w:s.w,h:s.h};
  function cl(v){return Math.max(0,Math.min(1,v));}
  if(DRAG.k==="move"){n.x=Math.max(0,Math.min(1-s.w,s.x+dx));n.y=Math.max(0,Math.min(1-s.h,s.y+dy));}
  else{
    var l=s.x,t=s.y,r=s.x+s.w,b=s.y+s.h;
    if(DRAG.k[1]==="l")l=Math.min(cl(s.x+dx),r-m); else r=Math.max(cl(s.x+s.w+dx),l+m);
    if(DRAG.k[0]==="t")t=Math.min(cl(s.y+dy),b-m); else b=Math.max(cl(s.y+s.h+dy),t+m);
    n={x:l,y:t,w:r-l,h:b-t};

function exportItem(it){
  var rd=rotDims(it), cw=it.crop.w*rd.w, ch=it.crop.h*rd.h;
  var k=Math.min(1,2000/Math.max(cw,ch));
  k=Math.min(k,Math.sqrt(16e6/(rd.w*rd.h))); // не больше ~16 Мп за раз, чтобы телефон не упал

  var fx=full.getContext("2d"); fx.fillStyle="#fff"; fx.fillRect(0,0,full.width,full.height);
  drawRotated(fx,it,k);
  var out=document.createElement("canvas"); out.width=Math.max(1,Math.round(cw*k)); out.height=Math.max(1,Math.round(ch*k));

  }
  if(b.dataset.rm){
    b.disabled=true;
    api("/remove",JSON.stringify({lessonId:lid,fileId:b.dataset.rm})).then(function(r){var l=findL(lid);if(l)l.sub=r.sub;keepScroll(render);},
      function(x){b.disabled=false;showErr(lid,x.message);});
  }
});

/* выбор периода в статистике */
document.addEventListener("click",function(e){var b=e.target.closest("[data-per]");if(!b)return;PER=b.dataset.per;render();});

/* поиск по урокам */
document.addEventListener("input",function(e){
  if(e.target.id!=="q")return;
  var q=e.target.value.trim().toLowerCase();
  document.querySelectorAll("#list .lesson").forEach(function(el){el.style.display=!q||el.textContent.toLowerCase().indexOf(q)>=0?"":"none";});
});

/* просмотр картинок */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-img]");
  if(b){
    $("#viewer").innerHTML='<div class="viewer" role="dialog" aria-modal="true" aria-label="'+esc(b.dataset.name)+'"><div class="v-bar"><span class="v-name">'+esc(b.dataset.name)+'</span>'+
      '<a class="btn ghost" href="'+esc(b.dataset.img)+'?download" rel="noopener noreferrer">Скачать</a><button class="btn" data-close>Закрыть</button></div>'+
      '<div class="v-body" data-close-bg><img src="'+esc(b.dataset.img)+'" alt="'+esc(b.dataset.name)+'"></div></div>';
    return;
  }
  if(e.target.closest("[data-close]")||e.target.hasAttribute("data-close-bg"))$("#viewer").innerHTML="";
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(ED)closeEditor();else $("#viewer").innerHTML="";}});

if(TOKEN)load(); else $("#app").innerHTML='<div class="panel empty">Неверная ссылка.</div>';
})();
</script>
</body>
</html>
