<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал групп</title>
<link rel="icon" href="/static/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="theme-color" content="#2446b8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: тетрадь в клетку. Шапка с группами, сводка «кто что не сдал», затем занятия карточками или таблицей */
  --paper:#f3f5f9; --surface:#ffffff; --text:#18202e; --muted:#5b6578; --line:#d8dfe9;
  --ink:#2446b8; --ink-soft:#e5ebfb; --on-ink:#ffffff;
  --ok:#17834a; --ok-soft:#dff3e7; --part:#9a6200; --part-soft:#fbefd6;
  --miss:#bd3618; --miss-soft:#fbe4dd; --wait:#5f6879; --wait-soft:#eaedf3;
  --grid:rgba(36,70,184,.07);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141c; --surface:#171d28; --text:#e5e9f1; --muted:#9ba5b6; --line:#2a3242;
    --ink:#8ea8ff; --ink-soft:#1d2849; --on-ink:#0c1120;
    --ok:#52c98a; --ok-soft:#153222; --part:#e6ae42; --part-soft:#3a2b0f;
    --miss:#ff8462; --miss-soft:#3e1d14; --wait:#a3acbc; --wait-soft:#232a37;
    --grid:rgba(142,168,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141c; --surface:#171d28; --text:#e5e9f1; --muted:#9ba5b6; --line:#2a3242;
  --ink:#8ea8ff; --ink-soft:#1d2849; --on-ink:#0c1120;
  --ok:#52c98a; --ok-soft:#153222; --part:#e6ae42; --part-soft:#3a2b0f;
  --miss:#ff8462; --miss-soft:#3e1d14; --wait:#a3acbc; --wait-soft:#232a37;
  --grid:rgba(142,168,255,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5;
  min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
h2{font-family:var(--font-display);font-weight:500;font-size:16px;margin:0;text-wrap:balance}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.tab .n{color:var(--muted);font-weight:400;margin-left:4px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.tab[aria-pressed="true"] .n{color:var(--on-ink);opacity:.75}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.empty{color:var(--muted);text-align:left}
.empty .btn{margin-top:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--miss);border-color:transparent;padding-left:0}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}
.notice{background:var(--part-soft);color:var(--text);border-radius:10px;padding:10px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.hint-box{background:var(--ink-soft);border-radius:10px;padding:10px 14px;font-size:14px}

/* Сводка долгов */
.debts-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.debts-head .muted{font-size:14px}
.muted{color:var(--muted)}
.debt-row{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:start}
.debt-row:first-of-type{border-top:none}
.debt-name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:none;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.none{background:var(--miss-soft);color:var(--miss)}
.chip.part{background:var(--part-soft);color:var(--part)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.all-ok{color:var(--ok);font-weight:600}

/* Панель инструментов */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink-soft);color:var(--ink)}

/* Карточка занятия */
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px;transition:box-shadow .3s}
.lesson.flash{box-shadow:0 0 0 3px var(--ink-soft)}
.l-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.l-date{font-family:var(--font-display);font-weight:500;font-size:16px}
.l-topic{font-weight:500;margin-top:2px}
.l-meta{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.hw{background:var(--paper);border-radius:8px;padding:10px 12px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.hw-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px 4px 4px;color:var(--text);text-decoration:none;font-size:14px;max-width:100%}
.file:hover{border-color:var(--ink)}
.file img{width:40px;height:40px;object-fit:cover;border-radius:5px;display:block}
.file .ext{width:40px;height:40px;border-radius:5px;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;text-transform:uppercase;flex:none}
.file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.marks{display:grid;grid-template-columns:minmax(120px,1fr) auto auto auto;column-gap:16px}
.score{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:14px;white-space:nowrap}
.sc-w{color:var(--muted)}
.sc-lbl{display:none}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;min-width:52px}
.sc:disabled{cursor:default}
.sc.good,.sc-t.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.sc.mid,.sc-t.mid{background:var(--part-soft);border-color:var(--part);color:var(--part);font-weight:600}
.sc.low,.sc-t.low{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);font-weight:600}
.period{display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.p-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.p-range label{color:var(--muted)}
.p-range input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px}
.p-count{margin-left:6px}
.period{position:relative}
.rp-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--text)}
.rp-btn svg{color:var(--ink)}
.rp-btn[aria-expanded="true"]{border-color:var(--ink)}
.rp-pop{position:absolute;left:16px;top:calc(100% - 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,14,22,.18);padding:14px;display:flex;flex-direction:column;gap:12px}
.rp-months{display:flex;gap:28px}
.rp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rp-title{font-weight:600}
.rp-nav{font-size:18px;line-height:1;padding:3px 10px}
.rp-nav-sp{width:36px}
.rp-grid{display:grid;grid-template-columns:repeat(7,38px);row-gap:3px}
.rp-wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.rp-day{height:36px;border:none;background:none;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums;position:relative;color:var(--text);border-radius:8px}
.rp-day:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.rp-day.in{background:var(--ink-soft);border-radius:0}
.rp-day.start,.rp-day.end{background:var(--ink);color:var(--on-ink);font-weight:700}
.rp-day.start{border-radius:8px 0 0 8px}
.rp-day.end{border-radius:0 8px 8px 0}
.rp-day.start.end{border-radius:8px}
.rp-day.today{font-weight:700;color:var(--ink)}
.rp-day.today.start,.rp-day.today.end{color:var(--on-ink)}
.rp-day.les::after,.rp-dot{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
.rp-day.start.les::after,.rp-day.end.les::after{background:var(--on-ink)}
.rp-dot{position:relative;display:inline-block;bottom:2px;left:0;margin:0 2px 0 0}
.rp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rp-foot .hint{margin:0}
.rp-actions{display:flex;gap:8px}
@media (max-width:640px){
  .rp-pop{left:8px;right:8px}
  .rp-grid{grid-template-columns:repeat(7,1fr)}
}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tile{background:var(--paper);border-radius:10px;padding:10px 12px}
.t-label{font-size:13px;color:var(--muted)}
.t-val{font-family:var(--font-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.s-card{display:flex;flex-direction:column;gap:10px}
.s-row{display:grid;grid-template-columns:minmax(150px,200px) 1fr 52px 130px;gap:12px;align-items:center}
.s-label{font-size:14px;font-weight:500;display:flex;flex-direction:column}
.s-detail{font-size:12px;color:var(--muted);font-weight:400}
.bar{position:relative;height:12px;background:var(--wait-soft);border-radius:6px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar-fill.f-att{background:var(--ok)} .bar-fill.f-hw{background:var(--ink)} .bar-fill.f-ok{background:var(--part)}
.bar-avg{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text);border-radius:1px}
.s-val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.diff{font-size:13px;border-radius:999px;padding:2px 9px;justify-self:start;white-space:nowrap}
.diff.up{background:var(--ok-soft);color:var(--ok)} .diff.down{background:var(--miss-soft);color:var(--miss)}
.diff.same,.diff.none{background:var(--wait-soft);color:var(--wait)}
@media (max-width:600px){
  .tiles{gap:6px}
  .tile{padding:8px}
  .t-val{font-size:19px}
  .s-row{grid-template-columns:1fr 46px auto;gap:6px 10px}
  .s-label{grid-column:1/-1}
}
.sc.star,.sc-t.star{background:var(--ink-soft);border-color:var(--ink);color:var(--ink);font-weight:600}
.sc-t{font-size:12px;border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums}
.modal input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.m-head,.m-row,.m-foot{grid-column:1/-1}
.m-head,.m-row{display:grid;grid-template-columns:subgrid;gap:8px 16px;align-items:center}
.m-head span,.m-row .opts{justify-self:start}
.m-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-bottom:6px}
.m-row{padding:6px 0;border-top:1px solid var(--line)}
.m-name{font-weight:500;overflow-wrap:anywhere}
.opts{display:inline-flex;gap:4px}
.m-foot .link{text-align:left}
.opt{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.opt:disabled{cursor:default}
.opt[aria-pressed="true"].yes{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt[aria-pressed="true"].no{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);font-weight:600}
.opt[aria-pressed="true"].half{background:var(--part-soft);border-color:var(--part);color:var(--part);font-weight:600}
.m-foot{display:flex;justify-content:flex-start;padding-top:8px}
@media (max-width:600px){
  .m-head{display:none}
  .marks{display:flex;flex-direction:column}
  .m-row{display:flex;flex-wrap:wrap;gap:6px 12px}
  .m-row .m-name{flex-basis:100%}
  .sc-lbl{display:inline}
  .debt-row{grid-template-columns:1fr}
}

/* Таблица */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
.grid-t thead th{position:sticky;top:0;background:var(--surface);z-index:1;color:var(--text);font-size:14px;border-bottom:2px solid var(--line);white-space:normal}
.grid-t thead th:first-child{border-top-left-radius:12px}
.grid-t thead th:last-child{border-top-right-radius:12px}
.grid-t th.c-date{text-align:left;width:1%;font-weight:500}
.c-topic{display:block;font-size:12px;color:var(--muted);font-weight:400;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.grid-t tr.sum th,.grid-t tr.sum td{background:var(--paper);font-weight:700;color:var(--text);padding:6px 8px}
.grid-t tr.sum th{font-weight:500;color:var(--muted);text-align:left}
.grid-t tr.sum.last th,.grid-t tr.sum.last td{border-bottom:2px solid var(--line)}
.grid-t tbody tr:last-child th,.grid-t tbody tr:last-child td{border-bottom:none}
.grid-t tbody tr:not(.sum):hover td,.grid-t tbody tr:not(.sum):hover th{background:var(--ink-soft)}
.th-date{background:none;border:none;color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;padding:0;text-decoration:underline dotted}
.cell{display:inline-grid;grid-template-columns:12px 16px;column-gap:6px;align-items:center;justify-items:center}
.cell.wide{grid-template-columns:12px 16px 38px}
.cell .c3{justify-self:start}
@media (max-width:600px){
  .table-wrap{overflow-x:auto}
  .grid-t thead th{position:static}
  .c-topic{display:none}
  th,td{padding:6px 2px}
  .grid-t th.c-date,.grid-t tr.sum th{padding-left:8px}
  .grid-t thead th{font-size:13px}
  .cell.wide{grid-template-columns:9px 12px 28px;column-gap:2px}
  .grid-t .sc-t{font-size:11px;padding:1px 3px}
  .grid-t .dot{width:8px;height:8px}
  .grid-t tr.sum td{font-size:13px}
  .grid-t tr.sum th{font-size:12px}
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:2px solid var(--line)}
.dot.y{background:var(--ok);border-color:var(--ok)}
.dot.n{background:transparent;border-color:var(--miss)}
.hm{font-weight:700;min-width:1.1em;display:inline-block}
.hm.done{color:var(--ok)} .hm.part{color:var(--part)} .hm.none{color:var(--miss)} .hm.wait{color:var(--wait)} .hm.nohw{color:var(--line)}
.stat{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:10px 2px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Окна */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:10}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.modal input[type=text],.modal input[type=date],.modal textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.modal textarea{resize:vertical;min-height:110px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.m-files{display:flex;flex-direction:column;gap:6px}
.m-sec{display:flex;flex-direction:column;gap:10px}
.m-sec-t{font-family:var(--font-display);font-size:14px;font-weight:500;padding-top:6px;border-top:1px solid var(--line)}
.rec{background:var(--ink-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rec .files{margin-top:0}
.rec-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.vid{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px 6px 6px;color:var(--text);text-decoration:none;font-weight:600}
.vid:hover{border-color:var(--ink)}
.vid-ico{width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px}
.vid-host{font-weight:400;color:var(--muted);font-size:13px}
.m-file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.m-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--miss);font-size:14px;margin:0}
.err:empty{display:none}
.m-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.m-actions .spacer{flex:1}
.g-edit{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.g-edit ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.g-edit li input{width:100%}
.s-line{display:flex;gap:6px;align-items:center}
.s-line input{flex:1}
.x:disabled{opacity:.35;cursor:default}
.x.mv{padding:4px 8px;font-size:14px;line-height:1}
.x{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--muted);font-size:13px}
.g-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.m-dirty.pulse{animation:pulse .3s ease}
.overlay{cursor:default}
.confirm{background:var(--miss-soft);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.file{cursor:pointer;font:inherit;text-align:left}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

<body>
<main class="wrap" id="app"><div class="panel empty">Загружаю журнал…</div></main>
<div id="modal"></div>
<div id="viewer"></div>
<script src="/static/site-shim.js"></script>
<script>
(function(){
"use strict";
var S = {db:null, assets:null, canWrite:true, groups:[], lessons:[], subs:[], cats:[], catsLoaded:false, mode:null, vars:[], atts:[], groupId:null, view:"list",
         loaded:{g:false,l:false}, stale:false, fatal:null, notice:null};
var M = null; // открытое окно
S.period = (function(){try{var v=JSON.parse(localStorage.getItem("tj-period")||"null");if(v&&v.preset)return v;}catch(e){}return {preset:"all"};})();
function savePeriod(){try{localStorage.setItem("tj-period",JSON.stringify(S.period));}catch(e){}}
var $ = function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(s){var p=String(s||today()).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
var fLong=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"});
var fWd=new Intl.DateTimeFormat("ru-RU",{weekday:"short"});
function fmtLong(s){var d=parseD(s);return fLong.format(d)+", "+fWd.format(d);}
function fmtShort(s){var p=String(s||"").split("-");return p[2]+"."+p[1];}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

function curGroup(){for(var i=0;i<S.groups.length;i++)if(S.groups[i].id===S.groupId)return S.groups[i];return null;}
function groupLessons(gid){
  return S.lessons.filter(function(l){return l.groupId===gid;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0);});
}
function mk(l,sid){return (l.marks||{})[sid]||{};}
function ensureGroup(){
  if(!curGroup()){var saved=store("tj-group");
    var g=S.groups.filter(function(x){return x.id===saved;})[0]||S.groups[0];
    S.groupId=g?g.id:null;}
}

/* ---------- запись: по одной на документ ---------- */
var queues={};
function write(path,fn){
  var run=function(){return fn().catch(function(e){
    if(e&&e.code==="unavailable")return new Promise(function(r){setTimeout(r,600+Math.random()*600);}).then(fn);
    throw e;});};
  queues[path]=(queues[path]||Promise.resolve()).then(run).catch(onWriteError);
  return queues[path];
}
function onWriteError(e){
  var c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"){S.canWrite=false;S.notice="Изменения не сохраняются: в этом просмотре журнал открыт только для чтения.";}
  else if(c==="quota_exceeded"){S.notice="Место в журнале закончилось. Удалите старые занятия или файлы и повторите.";}
  else{S.notice="Не получилось сохранить последнее изменение. Проверьте интернет и отметьте ещё раз.";}
  render();
}

/* ---------- отрисовка ---------- */
function render(){
  var ae=document.activeElement;
  if(S.view==="plan"&&ae&&ae.tagName==="INPUT"&&ae.closest&&ae.closest("#plan"))return;
  if((S.mode==="catalog"||S.mode==="variants")&&ae&&ae.tagName==="INPUT"&&ae.type==="text"&&ae.closest&&ae.closest("#app"))return;
  var h='<header class="top"><div><h1>Журнал групп</h1><p class="sub">Посещаемость и домашние задания</p></div>';
  if(S.db&&S.canWrite&&S.loaded.g)h+='<div class="top-btns">'+(window.SITE?'<button class="btn ghost" data-action="hw-open">Проверка домашек'+hwBadge()+'</button><button class="btn ghost" data-action="vt-open">Варианты</button><button class="btn ghost" data-action="cat-open">Банк заданий</button>':'')+(S.groups.length?'<button class="btn ghost" data-action="links">Ссылки учеников</button>':'')+'<button class="btn ghost" data-action="groups">Группы и ученики</button></div>';
  h+='<div class="site-links"><button class="link" data-action="push-open">Уведомления</button><button class="link" data-action="import">Перенос данных</button><button class="link" data-action="logout">Выйти</button></div>';
  if(!window.SITE&&S.db&&S.loaded.l&&dl)h+='<div class="site-links"><button class="link" data-action="export">Экспорт для переезда</button></div>';
  h+='</header>';
  if(S.notice)h+='<div class="notice" role="status"><span>'+esc(S.notice)+'</span><button class="link" data-action="dismiss">Закрыть</button></div>';
  if(S.fatal){$("#app").innerHTML=h+'<div class="panel empty">'+esc(S.fatal)+'</div>';return;}
  if(!(S.loaded.g&&S.loaded.l)){
    h+='<div class="panel empty">'+(S.stale?"Журнал пока не загрузился. Проверьте интернет: страница подтянет данные сама, как только связь появится.":"Загружаю журнал…")+'</div>';
    $("#app").innerHTML=h;return;
  }
  if(S.mode==="hw"){$("#app").innerHTML=h+renderHwPage();return;}
  if(S.mode==="catalog"){$("#app").innerHTML=h+renderCatalog();return;}
  if(S.mode==="variants"){$("#app").innerHTML=h+renderVariantsT();return;}
  if(!S.groups.length){
    h+='<div class="panel empty">Групп пока нет.'+(S.canWrite?'<br><button class="btn" data-action="groups">Добавить группы и учеников</button>':'')+'</div>';
    $("#app").innerHTML=h;return;
  }
  var g=curGroup(), lsAll=groupLessons(g.id), td=today();
  var fut=lsAll.filter(function(l){return l.date>td;}), nextL=fut.length?fut[fut.length-1]:null; // ближайшее будущее занятие
  // будущие занятия, к которым уже записана домашка, показываем все, а не только ближайшее
  var futShow=fut.filter(function(l){return l===nextL||hasHwContent(l);});
  var lsPast=lsAll.filter(function(l){return l.date<=td;}), ls=futShow.concat(lsPast);
  var nFuture=lsAll.length-ls.length;
  h+='<nav class="tabs" aria-label="Группы">'+S.groups.map(function(x){
    return '<button class="tab" data-action="tab" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===g.id)+'">'+esc(x.name||"Без названия")+'<span class="n">· '+(x.students||[]).length+' уч.</span></button>';
  }).join("")+'</nav>';
  if((g.students||[]).some(function(s){return /^Ученик \d+$/.test(s.name);})&&S.canWrite)
    h+='<div class="hint-box">Впишите настоящие имена: кнопка «Группы и ученики» справа вверху.</div>';
  h+=renderNewWorks(g);
  h+=renderDebts(g,lsPast,fut.filter(hasHwContent));
  h+='<div class="toolbar"><div class="seg" role="group" aria-label="Вид">'+
     '<button data-action="view" data-v="list" aria-pressed="'+(S.view==="list")+'">Занятия</button>'+
     '<button data-action="view" data-v="table" aria-pressed="'+(S.view==="table")+'">Таблица</button>'+

function genDates(lsAll){

/* запись голоса в WAV 16 кГц моно: такой файл играет на любом телефоне */
function recStart(){
  var id=V&&V.sub; if(!id||REC)return;
  var AC=window.AudioContext||window.webkitAudioContext, ctx;
  try{ctx=new AC();}catch(e){fbSay('<p class="err">Этот браузер не умеет записывать звук.</p>');return;}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(stream){
    if(ctx.state==="suspended")ctx.resume();
    var src=ctx.createMediaStreamSource(stream), proc=ctx.createScriptProcessor(4096,1,1), mute=ctx.createGain(), chunks=[];
    mute.gain.value=0;
    proc.onaudioprocess=function(e){chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));};
    src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    REC={sub:id,stream:stream,ctx:ctx,src:src,proc:proc,chunks:chunks,rate:ctx.sampleRate,t0:Date.now(),
      timer:setInterval(function(){var t=$("#fb-rec-t");var s=(Date.now()-REC.t0)/1000;if(t)t.textContent=fmtSec(s);if(s>=300)recStop();},500)};
    fbSay(''); fbRefresh();
  },function(){try{ctx.close();}catch(e){}fbSay('<p class="err">Нет доступа к микрофону. Разрешите микрофон для этого сайта в настройках браузера.</p>');});
}
function recStop(discard){
  var r=REC; if(!r)return; REC=null; clearInterval(r.timer);
  try{r.src.disconnect();r.proc.disconnect();}catch(e){}
  r.stream.getTracks().forEach(function(t){t.stop();});
  try{r.ctx.close();}catch(e){}
  if(discard){fbRefresh();return;}
  var len=r.chunks.reduce(function(a,c){return a+c.length;},0);
  if(len<r.rate*0.5){fbSay('<p class="hint">Запись слишком короткая.</p>');fbRefresh();return;}
  var all=new Float32Array(len),o=0; r.chunks.forEach(function(c){all.set(c,o);o+=c.length;});
  var rate=16000, ratio=r.rate/rate, n=Math.floor(len/ratio), pcm=new Int16Array(n);
  for(var i=0;i<n;i++){var a=Math.floor(i*ratio),b=Math.min(len,Math.floor((i+1)*ratio)),s=0;for(var j=a;j<b;j++)s+=all[j];var v=b>a?s/(b-a):0;v=Math.max(-1,Math.min(1,v));pcm[i]=v<0?v*0x8000:v*0x7fff;}
  var buf=new ArrayBuffer(44+pcm.length*2), dv=new DataView(buf);
  function str(off,t){for(var k=0;k<t.length;k++)dv.setUint8(off+k,t.charCodeAt(k));}
  str(0,"RIFF");dv.setUint32(4,36+pcm.length*2,true);str(8,"WAVE");str(12,"fmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);str(36,"data");dv.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  var dur=Math.round(n/rate), file=new File([buf],"Голосовое "+fmtSec(dur)+".wav",{type:"audio/wav"});
  fbSay('<p class="hint">Сохраняю запись…</p>'); fbRefresh();
  S.assets.upload(file).then(function(res){
    var d=fbDraft(r.sub); d.audio={id:res.id,url:res.url||("/_blob/"+res.id),name:file.name,type:"audio/wav",dur:dur}; d.dirty=true;
    fbSay(''); if(V&&V.sub===r.sub)fbRefresh();
  },function(){fbSay('<p class="err">Не получилось сохранить запись. Попробуйте ещё раз.</p>');});
}

/* ---------- статистика ---------- */
function studentStats(ls,sid){
  var a={y:0,n:0}, h={sum:0,n:0,done:0,part:0,none:0}, o={ok:0,n:0};
  ls.forEach(function(l){var m=mk(l,sid);
    if(m.att==="y")a.y++; else if(m.att==="n")a.n++;
    if(!l.noHw&&(m.hw==="done"||m.hw==="part"||m.hw==="none")){h.n++;h[m.hw]++;h.sum+=m.hw==="done"?1:m.hw==="part"?0.5:0;}
    var ok=okOf(l,sid); if(ok!=null){o.ok+=ok;o.n+=hasCount(l);}
  });
  return {
    att:{v:(a.y+a.n)?a.y/(a.y+a.n)*100:null, d:"был на "+a.y+" из "+(a.y+a.n)},
    hw:{v:h.n?h.sum/h.n*100:null, d:h.done+" сдано"+(h.part?", "+h.part+" частично":"")+(h.none?", "+h.none+" не сдано":"")},
    ok:{v:o.n?o.ok/o.n*100:null, d:o.ok+" из "+o.n+" "+plural(o.n,"номера","номеров","номеров")}
  };
}

function renderStatsBody(g,ls){
  var st=g.students||[];

  var avg={}, scale={};
  METRICS.forEach(function(mt){var k=mt[0], vals=all.map(function(r){return r.x[k].v;}).filter(function(v){return v!=null;});
    avg[k]=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
    scale[k]=Math.max(100,Math.max.apply(null,vals.concat([0])));});
  function pct(v){return v==null?"—":Math.round(v)+"%";}

      METRICS.map(function(mt){var k=mt[0], v=r.x[k].v, a=avg[k], sc=scale[k];

/* ---------- экспорт для переезда на свой сайт ---------- */
var CRC_T=null;
function crc32(u8){
  if(!CRC_T){CRC_T=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC_T[n]=c>>>0;}}
  var crc=0xFFFFFFFF;for(var i=0;i<u8.length;i++)crc=CRC_T[(crc^u8[i])&0xFF]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;
}
function zipBuild(entries){ // entries: [{name, data:Uint8Array}] — без сжатия
  var parts=[], central=[], offset=0, enc=new TextEncoder();
  entries.forEach(function(e){
    var name=enc.encode(e.name), crc=crc32(e.data), size=e.data.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,name,e.data);
    var c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);
    c.setUint32(42,offset,true);
    central.push(c.buffer,name);
    offset+=30+name.length+size;
  });
  var cdSize=central.reduce(function(a,b){return a+(b.byteLength||b.length);},0);
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end.buffer]),{type:"application/zip"});
}

    '<button type="button" class="close-x" data-action="m-close" aria-label="Закрыть" title="Закрыть">×</button></div>'+
    '<p>Соберу все группы, занятия, отметки и файлы в один архив. Его нужно будет загрузить на вашем сайте в разделе «Перенос данных».</p>'+

    '<div class="m-actions"><span class="spacer"></span><button class="btn ghost" data-action="m-close">Отмена</button><button class="btn" id="ex-go" data-action="ex-go">Собрать архив</button></div></div></div>';
}
function doExport(){
  var st=$("#ex-status"), go=$("#ex-go"); M.busy=true; go.disabled=true;
  var meta={}, list=[];
  S.lessons.forEach(function(l){(l.files||[]).concat(l.board||[]).forEach(function(f){if(f&&f.id&&!meta[f.id]){meta[f.id]={name:f.name,type:f.type||""};list.push(f);}});});
  var entries=[], failed=0, i=0;
  function next(){
    if(!M||M.kind!=="export")return;
    if(i>=list.length)return finish();
    var f=list[i++]; st.textContent="Собираю файлы: "+i+" из "+list.length+"…";
    getBlob(f).then(function(b){return b.arrayBuffer();}).then(function(ab){entries.push({name:"files/"+f.id,data:new Uint8Array(ab)});},
      function(){failed++;delete meta[f.id];}).then(next);
  }
  function finish(){
    var data={version:1,exported:new Date().toISOString(),
      groups:S.groups.map(function(g){var d=Object.assign({},g);delete d.id;return {id:g.id,data:d};}),
      lessons:S.lessons.map(function(l){var d=Object.assign({},l);delete d.id;return {id:l.id,data:d};}),
      files:meta};
    entries.unshift({name:"data.json",data:new TextEncoder().encode(JSON.stringify(data))});
    st.textContent="Упаковываю архив…";
    setTimeout(function(){
      var blob=zipBuild(entries), d=new Date();
      var name="журнал-экспорт-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".zip";
      dl.save({filename:name,data:blob}).then(function(){
        st.textContent="Готово: архив сохранён ("+Math.round(blob.size/1048576)+" МБ, файлов "+(entries.length-1)+")."+(failed?" Не удалось забрать файлов: "+failed+".":"");
        M.busy=false;
      },function(e){M.busy=false;go.disabled=false;st.textContent=e&&e.code==="declined"?"Сохранение отменено. Нажмите «Собрать архив» ещё раз.":"Не получилось сохранить архив. Попробуйте ещё раз.";});
    },50);
  }

}

/* ---------- уведомления на телефон ---------- */
var PUSH={reg:null};
function pushSupported(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}
function isStandalone(){return !!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));}
function deviceLabel(){var u=navigator.userAgent;var d=/iPhone/.test(u)?"iPhone":/iPad/.test(u)||isIOS()?"iPad":/Android/.test(u)?"Android":/Mac/.test(u)?"Mac":/Windows/.test(u)?"Windows":"Устройство";
  var b=/YaBrowser/.test(u)?"Яндекс Браузер":/Edg\//.test(u)?"Edge":/Firefox/.test(u)?"Firefox":/Chrome|CriOS/.test(u)?"Chrome":/Safari/.test(u)?"Safari":"";return d+(b?" · "+b:"");}
function swReg(){
  if(PUSH.reg)return Promise.resolve(PUSH.reg);
  return navigator.serviceWorker.register("/sw.js",{scope:"/"}).then(function(){return navigator.serviceWorker.ready;}).then(function(r){PUSH.reg=r;return r;});
}
if(pushSupported()){
  swReg().catch(function(){});
  navigator.serviceWorker.addEventListener("message",function(e){if(e.data&&e.data.type==="refresh"&&window.SITE&&window.SITE.refresh)window.SITE.refresh();});
}
function b64uToBytes(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function pushApi(path,body){return fetch(path,{method:body?"POST":"GET",credentials:"same-origin",headers:body?{"X-Journal":"1","Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));return j;});});}
function openPush(){
  M={kind:"push"};
  $("#modal").innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pu-title"><div class="m-top"><h2 id="pu-title">Уведомления</h2>'+
    '<button type="button" class="close-x" data-action="m-close" aria-label="Закрыть" title="Закрыть">×</button></div>'+
    '<p>Журнал напишет на это устройство, когда ученик пришлёт домашку или вторую часть варианта, а также когда решит вариант: результат первой попытки и каждое улучшение.</p>'+
    '<div id="pu-body"><p class="hint">Проверяю…</p></div></div></div>';
  pushRender();
}
function pushRender(msg){
  var box=$("#pu-body"); if(!box)return;
  function out(h){box.innerHTML=h+(msg?'<p class="pg-msg" role="status" style="margin-top:10px;white-space:pre-line">'+esc(msg)+'</p>':'');}
  if(isIOS()&&!isStandalone()){
    return out('<div class="hint-box"><p style="margin:0 0 6px"><b>На iPhone уведомления работают, только если журнал открыт с экрана «Домой»:</b></p><ol style="margin:0;padding-left:20px"><li>Нажмите в Safari кнопку «Поделиться» (квадрат со стрелкой).</li><li>Выберите «На экран „Домой“» → «Добавить».</li><li>Откройте журнал с новой иконки и войдите паролем.</li><li>Снова нажмите «Уведомления» и включите их.</li></ol></div>');
  }
  if(!pushSupported())return out('<p class="hint">Этот браузер не умеет показывать уведомления от сайтов. Попробуйте Chrome, Safari, Edge или Яндекс Браузер.</p>');
  if(Notification.permission==="denied")return out('<p class="hint">Уведомления для этого сайта запрещены в настройках. '+(isIOS()?'Откройте «Настройки» iPhone → «Уведомления» → «Журнал» и включите «Допуск уведомлений».':'Разрешите их в настройках сайта (значок замка слева от адреса) и обновите страницу.')+'</p>');
  swReg().then(function(reg){return reg.pushManager.getSubscription();}).then(function(sub){
    return pushApi("/api/push"+(sub?"?endpoint="+encodeURIComponent(sub.endpoint):"")).then(function(j){
      var on=!!(sub&&j.on);
      out('<p><b>'+(on?'На этом устройстве уведомления включены.':'На этом устройстве уведомления выключены.')+'</b>'+(j.devices?'<br><span class="hint">Всего устройств с уведомлениями: '+j.devices+'.</span>':'')+'</p>'+
        '<div class="m-actions">'+(on?'<button class="btn ghost" data-action="push-off">Выключить здесь</button><span class="spacer"></span><button class="btn" data-action="push-test">Прислать пробное</button>'
          :'<span class="spacer"></span><button class="btn" data-action="push-on">Включить уведомления</button>')+'</div>');
    });
  }).catch(function(e){out('<p class="hint">Не получилось проверить: '+esc(e.message)+'</p>');});
}
function pushOn(){
  var key;
  pushRender("Включаю…");
  Notification.requestPermission().then(function(p){
    if(p!=="granted")throw new Error(p==="denied"?"вы запретили уведомления. Их можно разрешить в настройках.":"разрешение не получено.");
    return pushApi("/api/push");
  }).then(function(j){key=j.key;return swReg();}).then(function(reg){
    return reg.pushManager.getSubscription().then(function(old){return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(key)});});
  }).then(function(sub){return pushApi("/api/push/subscribe",{subscription:sub.toJSON(),device:deviceLabel()});})
    .then(function(){return pushApi("/api/push/test",{});})
    .then(function(r){pushRender((r.sent?"Готово! Должно прийти пробное уведомление.\n":"")+pushReport(r));})
    .catch(function(e){pushRender("Не получилось: "+e.message);});
}
function pushOff(){
  swReg().then(function(reg){return reg.pushManager.getSubscription();}).then(function(sub){
    if(!sub)return;
    return pushApi("/api/push/unsubscribe",{endpoint:sub.endpoint}).then(function(){return sub.unsubscribe();});
  }).then(function(){pushRender("Выключено на этом устройстве.");},function(e){pushRender("Не получилось: "+e.message);});
}
function pushReport(r){
  return (r.report||[]).map(function(x){return x.device+": "+(x.ok?"отправлено":"не отправлено — "+x.error);}).join("\n");
}
function pushTest(){
  pushApi("/api/push/test",{}).then(function(r){pushRender(pushReport(r)||"Нет устройств с уведомлениями.");},function(e){pushRender("Не получилось: "+e.message);});
}

  var h=u.finished?(u.errs.length?'Прикреплено '+(u.total-u.errs.length)+' из '+u.total+'. Не получилось: '+esc(u.errs.join('; '))+'. <button class="link" data-action="cat-up-ok" data-t="'+esc(tid)+'">Понятно</button>':'Готово, прикреплено: '+u.total+'.'):'Загружаю '+(u.done+1)+' из '+u.total+'…';
  return '<p class="pg-msg" role="status" style="margin-top:6px">'+h+'</p>';} // открытый каталог, раскрытые задания, открытая форма ссылки
function catById(id){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===id)return S.cats[i];return null;}
function catTaskNums(n){var m=String(n||"").match(/\d+/g);if(!m)return [];var a=m.map(Number);if(/[–-]/.test(n)&&a.length===2&&a[1]>a[0]&&a[1]-a[0]<30){var r=[];for(var i=a[0];i<=a[1];i++)r.push(i);return r;}return a;}
function topicNums(t){var out=[],re=/№\s*(\d+)(?:\s*[–-]\s*(\d+))?/g,m;while((m=re.exec(String(t||"")))){var a=+m[1],b=m[2]?+m[2]:a;for(var i=a;i<=Math.min(b,a+30);i++)out.push(i);}return out;}
function catLessons(cat,task){
  var nums=catTaskNums(task.n), gs=cat.groups||[];
  if(!nums.length)return [];
  return S.lessons.filter(function(l){return gs.indexOf(l.groupId)>=0&&l.date<=today()&&topicNums(l.topic).some(function(x){return nums.indexOf(x)>=0;});})
    .sort(function(a,b){return a.date<b.date?1:-1;});
}
function saveCat(cat,delay){

    var d=Object.assign({},cat); delete d.id;

  },delay||0);
}

function catTask(cat,tid){var r=null;(cat.tasks||[]).forEach(function(t){if(t.id===tid)r=t;});return r;}
function catAction(a,d,b){
  var cat=catById(CT.cur), t=cat&&d.t?catTask(cat,d.t):null;
  switch(a){
    case "cat-open": S.mode="catalog"; window.scrollTo(0,0); render(); return true;
    case "cat-back": S.mode=null; render(); return true;
    case "cat-tab": CT.cur=d.c; CT.newOpen=false; CT.delCat=false; render(); return true;
    case "cat-new-open": CT.newOpen=true; render(); return true;
    case "cat-new-close": CT.newOpen=false; render(); return true;
    case "cat-create": CT.newOpen=false; newCatalog(d.k); return true;
    case "cat-toggle": CT.open[d.t]=!CT.open[d.t]; render(); return true;
    case "cat-up-ok": delete CT.up[d.t]; render(); return true;
    case "cat-task-add": {var nt={id:rid(),n:"",title:"",materials:[],practice:[]};cat.tasks=(cat.tasks||[]).concat([nt]);CT.open[nt.id]=true;saveCat(cat);render();
      var el=document.getElementById("tn-"+nt.id);if(el){el.focus();el.scrollIntoView({block:"center"});}return true;}
    case "cat-task-del": cat.tasks=cat.tasks.filter(function(x){return x.id!==d.t;});
      (t&&t.materials||[]).forEach(function(m){if(m.id&&S.assets)S.assets.delete(m.id).catch(function(){});});
      saveCat(cat);render();return true;
    case "cat-del": CT.delCat=true; render(); return true;
    case "cat-del-no": CT.delCat=false; render(); return true;
    case "cat-del-yes": S.cats=S.cats.filter(function(x){return x.id!==cat.id;}); CT.delCat=false; CT.cur=null;
      write("catalogs/"+cat.id,function(){return S.db.doc("catalogs/"+cat.id).delete();}); render(); return true;
    case "cat-form": CT.form={t:d.t,w:d.w}; render(); var f=document.getElementById("cfl"); if(f)f.focus(); return true;
    case "cat-form-close": CT.form=null; render(); return true;
    case "cat-form-add": {
      var lab=$("#cfl").value.trim(), url=normUrl($("#cfu").value);
      if(!url){$("#cfu").focus();return true;}
      t[d.w]=(t[d.w]||[]).concat([{kind:"link",name:lab||hostOf(url),url:url}]); CT.form=null; saveCat(cat); render(); return true;}
    case "cat-item-del": {var it=t[d.w][+d.i]; if(it&&it.id&&S.assets)S.assets.delete(it.id).catch(function(){});
      t[d.w]=t[d.w].filter(function(x,k){return k!==+d.i;}); saveCat(cat); render(); return true;}
    case "cat-open-file": {var fl=(t.materials||[]).filter(function(m){return m.kind!=="link";});var fm=t.materials[+d.i];
      V={files:fl,i:Math.max(0,fl.indexOf(fm))};renderViewer();return true;}
  }
  return false;
}
function catInput(tg){
  var cat=catById(CT.cur); if(!cat)return false;
  if(tg.id==="cat-name"){cat.name=tg.value;saveCat(cat,600);var tb=document.querySelector('.tab[data-c="'+cat.id+'"]');if(tb)tb.textContent=cat.name||"Без названия";return true;}
  if(tg.dataset.tn){var t=catTask(cat,tg.dataset.tn);t.n=tg.value.trim();saveCat(cat,600);return true;}
  if(tg.dataset.tt){var t2=catTask(cat,tg.dataset.tt);t2.title=tg.value;saveCat(cat,600);return true;}
  return false;
}
function catChange(tg){
  var cat=catById(CT.cur); if(!cat)return false;
  if(tg.dataset.catg){var gs=(cat.groups||[]).filter(function(x){return x!==tg.dataset.catg;});if(tg.checked)gs.push(tg.dataset.catg);cat.groups=gs;saveCat(cat);render();return true;}
  if(tg.dataset.catfile&&tg.files&&tg.files.length){
    var catId=cat.id, tid=tg.dataset.catfile, list=Array.prototype.slice.call(tg.files); tg.value="";
    var st=CT.up[tid]={total:list.length,done:0,errs:[]}; render();
    (function next(k){
      if(k>=list.length){
        st.finished=true; render();
        if(!st.errs.length)setTimeout(function(){if(CT.up[tid]===st){delete CT.up[tid];render();}},4000);
        return;
      }
      var file=list[k];
      if(file.size>25*1048576){st.errs.push("«"+file.name+"» — больше 25 МБ");st.done++;render();return next(k+1);}
      S.assets.upload(file).then(function(r){
        var c=catById(catId), t=c&&catTask(c,tid);   // берём свежие данные: страница могла обновиться
        if(t){t.materials=(t.materials||[]).concat([{kind:"file",id:r.id,url:r.url||("/_blob/"+r.id),name:file.name,type:r.contentType||file.type}]);saveCat(c);}
        st.done++; render(); next(k+1);
      },function(e){st.errs.push("«"+file.name+"» — "+(e&&e.message||"ошибка"));st.done++;render();next(k+1);});
    })(0);
    return true;
  }
  return false;
}

var SC={cfg:null,v2:{},pt:{},paste:{},open:false,loaded:false,loading:false,err:"",msg:"",t:null};
function scReq(m,u,b){
  return fetch(u,{method:m,credentials:"same-origin",headers:{"X-Journal":"1","Content-Type":"application/json"},body:b?JSON.stringify(b):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));return j;});});
}
function scCfg(){
  if(!SC.cfg)SC.cfg={};
  var c=SC.cfg;
  if(!Array.isArray(c.ege))c.ege=[]; if(!Array.isArray(c.oge))c.oge=[];
  if(!c.groups||typeof c.groups!=="object"||Array.isArray(c.groups))c.groups={};
  return c;
}
function scLoad(){
  SC.loading=true;
  Promise.all([scReq("GET","/api/docs/settings"),scReq("GET","/api/docs/vscores")]).then(function(r){
    SC.cfg=null; (r[0].docs||[]).forEach(function(d){if(d.id==="scales")SC.cfg=d.data;});
    SC.v2={}; (r[1].docs||[]).forEach(function(d){if(d.data&&typeof d.data.score==="number")SC.v2[d.id]=d.data.score;});
    scCfg(); SC.loaded=true; SC.loading=false; SC.err="";
    if(S.mode==="variants")render();
  },function(e){SC.loading=false;SC.err=e.message||"ошибка";if(S.mode==="variants")render();});
}
function scMsg(t){SC.msg=t;var el=document.getElementById("sc-msg");if(el)el.textContent=t;}
function scSave(){
  clearTimeout(SC.t); scMsg("Сохраняю…");
  SC.t=setTimeout(function(){
    var c=scCfg();
    scReq("PUT","/api/docs/settings/scales",{ege:c.ege,oge:c.oge,groups:c.groups,updated:Date.now()})
      .then(function(){scMsg("Сохранено");},function(e){scMsg("Не сохранилось: "+e.message);});
  },600);
}
// к какому экзамену готовится группа, если учитель не выбрал вручную
function scAuto(name){
  var t=String(name||"");
  if(/огэ|омикрон|omicron/i.test(t))return "oge";
  if(/егэ|альфа|бет+а|alpha|beta/i.test(t))return "ege";
  return "none";
}
var SC_EX={ege:"ЕГЭ",oge:"ОГЭ",none:"не переводить"};

    for(var i=0;i<a.length;i++)h+='<label class="sc-cell"><span>'+i+'</span><input type="text" inputmode="decimal" data-sccell="'+ex+'" data-p="'+i+'" value="'+(a[i]==null?"":esc(a[i]))+'" aria-label="Первичный '+i+'"></label>';

function scCellInput(t){
  var ex=t.dataset.sccell, p=+t.dataset.p, raw=t.value.trim().replace(",","."), a=scCfg()[ex];
  if(raw==="")a[p]=null;
  else if(/^\d+(\.\d+)?$/.test(raw))a[p]=parseFloat(raw);
  else{t.classList.add("vt-miss");return;}
  t.classList.remove("vt-miss"); scSave();
}
function scResize(ex,val){
  var n=parseInt(String(val).trim(),10), a=scCfg()[ex];
  if(isNaN(n)||n<0||n>100){render();return;}
  while(a.length<n+1)a.push(null);
  a.length=n+1; scSave(); render();
}
function scPaste(ex){
  var a=scCfg()[ex], n=0;
  String(SC.paste[ex]||"").split(/\r?\n/).forEach(function(line){
    var m=/(\d+)\D+(\d+(?:[.,]\d+)?)/.exec(line); if(!m)return;
    var pr=+m[1]; if(pr>100)return;
    while(a.length<pr+1)a.push(null);
    a[pr]=parseFloat(m[2].replace(",",".")); n++;
  });
  SC.paste[ex]="";
  if(n){scSave();scMsg("Применено строк: "+n);} else scMsg("Не нашла в списке ни одной пары чисел.");
  render();
}
function scGroupExam(id,val){
  var gs=scCfg().groups;
  if(val==="auto")delete gs[id]; else gs[id]=val;
  scSave();
}
function p2Key(vid,sid){return (vid+"_"+sid).slice(0,64);}
function p2Cell(v,st){
  if(!(v.part2||[]).length||!SC.loaded)return "";
  var val=SC.v2[p2Key(v.id,st.id)];
  return '<label class="vt-p2">ч. 2, баллы <input type="text" inputmode="decimal" class="vt-p2in" data-vp2="'+esc(v.id)+'" data-s="'+esc(st.id)+'" value="'+(val==null?"":esc(val))+'" aria-label="Баллы за часть 2: '+esc(st.name)+'"></label>';
}
function p2Typed(t){
  var vid=t.dataset.vp2, sid=t.dataset.s, key=p2Key(vid,sid), raw=t.value.trim().replace(",",".");
  clearTimeout(SC.pt[key]);
  if(raw!==""&&!/^\d+(\.\d+)?$/.test(raw)){t.classList.add("vt-miss");return;}
  t.classList.remove("vt-miss");
  SC.pt[key]=setTimeout(function(){
    if(raw===""){delete SC.v2[key];scReq("DELETE","/api/docs/vscores/"+key).catch(function(){});return;}
    var n=parseFloat(raw); SC.v2[key]=n;
    scReq("PUT","/api/docs/vscores/"+key,{variantId:vid,studentId:sid,score:n,updated:Date.now()})
      .catch(function(e){alert("Баллы за часть 2 не сохранились: "+e.message);});
  },600);
}

function varById(id){for(var i=0;i<S.vars.length;i++)if(S.vars[i].id===id)return S.vars[i];return null;}
function attFor(vid,sid){for(var i=0;i<S.atts.length;i++){var a=S.atts[i];if(a.variantId===vid&&a.studentId===sid)return a;}return null;}
function attSummary(a,v){
  if(!a||!a.attempts||!a.attempts.length)return null;
  var sc=a.attempts.map(function(x){return (x.correct||[]).length;});
  return {count:sc.length,first:sc[0],best:Math.max.apply(null,sc),total:(v.part1||[]).length,revealed:Object.keys(a.revealed||{}).length,at:a.updated||a.attempts[a.attempts.length-1].at};
}
function saveVar(v){var d=Object.assign({},v);delete d.id;write("variants/"+v.id,function(){return S.db.doc("variants/"+v.id).set(d);});}
function vSet(v){var st=String(v.set||"").trim(),src=String(v.source||"");if(st&&!/^ЕГЭ 20\d\d$/.test(st))return st;var m=/(20\d\d)/.exec(st)||/(20\d\d)/.exec(src);if(!m)return st;return (/ЕГЭ\s*проф/i.test(src)?"ЕГЭ профиль ":"ЕГЭ ")+m[1];}
function renderVariantsT(){
  var h='<div class="toolbar"><button class="btn ghost" data-action="vt-back">← К журналу</button><h2 style="margin:0">Варианты</h2></div>';
  h+='<section class="panel vt-up"><h2>Загрузить варианты</h2><p class="hint" style="margin:6px 0 10px">Архив с вариантами, который подготовил Claude: задания картинками и ответы. Ответы хранятся только на вашем сервере, ученикам они не видны.</p>'+
    '<div class="cat-btns"><label class="btn" for="vt-file" style="cursor:pointer">Выбрать архив</label><input type="file" id="vt-file" accept=".zip,application/zip" hidden></div>'+
    (VT.msg?'<p class="pg-msg" role="status" style="margin-top:8px">'+esc(VT.msg)+'</p>':'')+'</section>';
  h+=renderScalesT();
  var vs=S.vars.slice().sort(function(a,b){return vSet(b).localeCompare(vSet(a),'ru',{numeric:true})||String(a.title||'').localeCompare(String(b.title||''),'ru',{numeric:true})||(a.order||0)-(b.order||0);});
  var vsets=[];vs.forEach(function(v){if(vsets.indexOf(vSet(v))<0)vsets.push(vSet(v));});
  if(!vs.length)return h+'<div class="panel empty">Вариантов пока нет.</div>';
  // вкладки по сборникам
  if(vsets.indexOf(VT.set)<0)VT.set=vsets[0];
  if(vsets.length>1)h+='<div class="vt-tabs" role="tablist" aria-label="Сборники">'+vsets.map(function(st){
    var n=vs.filter(function(v){return vSet(v)===st;}).length;
    return '<button class="tab" role="tab" data-action="vt-set" data-set="'+esc(st)+'" aria-selected="'+(st===VT.set)+'" aria-pressed="'+(st===VT.set)+'">'+esc(st||"Без сборника")+' <span class="vt-cnt">'+n+'</span></button>';}).join("")+'</div>';
  vs=vs.filter(function(v){return vSet(v)===VT.set;});
  // результаты
  var g=S.groups.filter(function(x){return x.id===VT.group;})[0]||curGroup()||S.groups[0];
  if(g){
    var gv=vs.filter(function(v){return (v.groups||[]).indexOf(g.id)>=0;});
    h+='<section class="panel"><div class="plan-head"><h2>Результаты'+(VT.set?' · '+esc(VT.set):'')+'</h2><div class="seg" role="group" aria-label="Группа">'+S.groups.map(function(x){
      return '<button data-action="vt-group" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===g.id)+'">'+esc(x.name)+'</button>';}).join("")+'</div></div>';
    if(!gv.length)h+='<p class="hint" style="margin-top:8px">Группе «'+esc(g.name)+'» пока не открыт ни один вариант. Отметьте группу у нужных вариантов ниже.</p>';
    else{
      h+='<div class="table-wrap" style="margin-top:10px;overflow-x:auto"><table class="vt-res"><thead><tr><th scope="col">Ученик</th>'+gv.map(function(v){var yy=(/(20\d\d)/.exec(vSet(v))||[])[1];return '<th scope="col" title="'+esc(v.title+(vSet(v)?' · '+vSet(v):''))+'">'+esc(v.title.replace(/^Вариант\s*/,"В"))+'</th>';}).join("")+'</tr></thead><tbody>'+
        (g.students||[]).map(function(s){
          return '<tr><th scope="row">'+esc(s.name)+'</th>'+gv.map(function(v){
            var r=attSummary(attFor(v.id,s.id),v), sub=subFor("var-"+v.id,s.id), hasSub=sub&&((sub.files&&sub.files.length)||sub.comment);
            var cell=r?'<span class="sc-t '+scoreCls(r.best,r.total)+'">'+r.best+'/'+r.total+'</span><span class="vt-small">1-я: '+r.first+' · ×'+r.count+(r.revealed?' · подсм. '+r.revealed:'')+'</span>':'<span class="muted">—</span>';
            if(hasSub)cell+='<button class="sub-b'+(subUnseen(sub)?' new':'')+'" data-action="sub-open" data-l="var-'+esc(v.id)+'" data-s="'+esc(s.id)+'">ч. 2</button>';
            cell+=p2Cell(v,s);
            return '<td>'+cell+'</td>';
          }).join("")+'</tr>';
        }).join("")+'</tbody></table></div><p class="hint" style="margin-top:8px">В клетке: лучший результат первой части, ниже — результат с первой попытки, число попыток и сколько ответов ученик подсмотрел. «ч. 2» — фото решений второй части.</p>';
    }
    h+='</section>';
  }
  var lastSet=null;
  h+='<div class="cat-list">'+vs.map(function(v){
    var head='';
    var open=!!VT.open[v.id], n1=(v.part1||[]).length, noAns=(v.part1||[]).filter(function(t){return !t.answer;}).length;
    var x=head+'<article class="cat-task'+(open?' open':'')+'"><div class="vt-row"><button class="cat-row" data-action="vt-toggle" data-v="'+esc(v.id)+'" aria-expanded="'+open+'">'+
      '<span class="cat-title">'+esc(v.title)+(vSet(v)?' <span class="vt-setname">'+esc(vSet(v))+'</span>':'')+'</span><span class="cat-meta">'+n1+' + '+(v.part2||[]).length+' заданий'+(noAns?' · без ответа: '+noAns:'')+'</span><span class="cat-chev" aria-hidden="true">'+(open?'▴':'▾')+'</span></button>'+
      '<span class="vt-groups">'+S.groups.map(function(gr){var on=(v.groups||[]).indexOf(gr.id)>=0;
        return '<label class="check"><input type="checkbox" data-vtg="'+esc(v.id)+'" data-g="'+esc(gr.id)+'"'+(on?' checked':'')+'> '+esc(gr.name)+'</label>';}).join("")+'</span></div>';
    if(open){
      x+='<div class="cat-body"><div class="field" style="max-width:420px"><label for="vtt-'+v.id+'">Название</label><input type="text" id="vtt-'+v.id+'" data-vtt="'+esc(v.id)+'" value="'+esc(v.title)+'"></div>'+
        '<div class="field" style="max-width:420px"><label for="vts-'+v.id+'">Сборник</label><input type="text" id="vts-'+v.id+'" data-vts="'+esc(v.id)+'" value="'+esc(vSet(v))+'" placeholder="например, ЕГЭ профиль 2026"></div>'+
        '<p class="hint">Проверьте картинки и ответы. Ответ можно исправить прямо здесь. Если подходят несколько записей, разделите их чертой: <b>0,5|1/2</b>. Запятая и точка считаются одинаково.</p>'+
        '<div class="vt-tasks">'+(v.part1||[]).map(function(t,k){
          return '<div class="vt-task"><div class="v-n">'+esc(t.n)+'</div><div>'+(t.files||[]).map(function(f){return '<img class="vt-img" src="'+esc(f.url||("/_blob/"+f.id))+'" alt="" loading="lazy">';}).join("")+
            '<div class="v-ans"><label for="vta-'+v.id+'-'+k+'">Ответ</label><input type="text" id="vta-'+v.id+'-'+k+'" data-vta="'+esc(v.id)+'" data-k="'+k+'" value="'+esc(t.answer||"")+'"'+(t.answer?'':' class="vt-miss" placeholder="нет ответа"')+'></div></div></div>';
        }).join("")+(v.part2||[]).map(function(t){
          return '<div class="vt-task"><div class="v-n">'+esc(t.n)+'</div><div>'+(t.files||[]).map(function(f){return '<img class="vt-img" src="'+esc(f.url||("/_blob/"+f.id))+'" alt="" loading="lazy">';}).join("")+'<p class="hint">Вторая часть: ученик присылает фото решения.</p></div></div>';
        }).join("")+'</div>'+
        '<div class="cat-foot2">'+(VT.del===v.id?'<span class="confirm">Удалить «'+esc(v.title)+'» вместе с результатами учеников?<button class="btn" style="background:var(--miss);border-color:var(--miss)" data-action="vt-del-yes" data-v="'+esc(v.id)+'">Удалить</button><button class="link" data-action="vt-del-no">Отмена</button></span>'
          :'<button class="btn danger" data-action="vt-del" data-v="'+esc(v.id)+'">Удалить вариант</button>')+'</div></div>';
    }
    return x+'</article>';
  }).join("")+'</div>';
  return h;
}
function vtAction(a,d){
  switch(a){
    case "vt-sc-toggle": SC.open=!SC.open; render(); return true;
    case "vt-sc-paste": scPaste(d.ex); return true;
    case "vt-open": S.mode="variants"; window.scrollTo(0,0); render(); return true;
    case "vt-back": S.mode=null; render(); return true;
    case "vt-group": VT.group=d.g; render(); return true;
    case "vt-set": VT.set=d.set; render(); return true;
    case "vt-toggle": VT.open[d.v]=!VT.open[d.v]; render(); return true;
    case "vt-del": VT.del=d.v; render(); return true;
    case "vt-del-no": VT.del=null; render(); return true;
    case "vt-del-yes": {
      var v=varById(d.v); if(!v)return true;
      (v.part1||[]).concat(v.part2||[]).forEach(function(t){(t.files||[]).forEach(function(f){S.assets&&S.assets.delete(f.id).catch(function(){});});});
      S.vars=S.vars.filter(function(x){return x.id!==v.id;});
      write("variants/"+v.id,function(){return S.db.doc("variants/"+v.id).delete();});
      S.atts.filter(function(x){return x.variantId===v.id;}).forEach(function(x){write("attempts/"+x.id,function(){return S.db.doc("attempts/"+x.id).delete();});});
      Object.keys(SC.v2).filter(function(k){return k.indexOf(v.id+"_")===0;}).forEach(function(k){delete SC.v2[k];scReq("DELETE","/api/docs/vscores/"+k).catch(function(){});});
      VT.del=null; render(); return true;}
  }
  return false;
}
function vtInput(t){
  if(t.dataset.vp2!==undefined){p2Typed(t);return true;}
  if(t.dataset.sccell!==undefined){scCellInput(t);return true;}
  if(t.dataset.scmax!==undefined)return true;
  if(t.dataset.scpaste!==undefined){SC.paste[t.dataset.scpaste]=t.value;return true;}
  if(t.dataset.vtt){var v=varById(t.dataset.vtt);v.title=t.value;clearTimeout(VT.tt);VT.tt=setTimeout(function(){saveVar(v);},600);return true;}
  if(t.dataset.vts){var vs1=varById(t.dataset.vts);vs1.set=t.value.trim();clearTimeout(VT.ts);VT.ts=setTimeout(function(){saveVar(vs1);},600);return true;}
  if(t.dataset.vta){var v2=varById(t.dataset.vta);v2.part1[+t.dataset.k].answer=t.value.trim();t.classList.toggle("vt-miss",!t.value.trim());clearTimeout(VT.ta);VT.ta=setTimeout(function(){saveVar(v2);},600);return true;}
  return false;
}
function vtChange(t){
  if(t.dataset.scmax!==undefined){scResize(t.dataset.scmax,t.value);return true;}
  if(t.dataset.scgroup!==undefined){scGroupExam(t.dataset.scgroup,t.value);return true;}
  if(t.dataset.vtg){var v=varById(t.dataset.vtg);var gs=(v.groups||[]).filter(function(x){return x!==t.dataset.g;});if(t.checked)gs.push(t.dataset.g);v.groups=gs;saveVar(v);render();return true;}
  if(t.id==="vt-file"&&t.files&&t.files[0]){
    var f=t.files[0]; t.value=""; VT.msg="Загружаю «"+f.name+"» ("+Math.max(1,Math.round(f.size/1048576))+" МБ)…"; render();
    fetch("/api/variants/import",{method:"POST",credentials:"same-origin",headers:{"X-Journal":"1","Content-Type":"application/zip"},body:f})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));return j;});})
      .then(function(j){var upd=j.variants.filter(function(x){return x.updated;}).length, nw=j.variants.length-upd; VT.msg=(nw?"Добавлено новых вариантов: "+nw+". Отметьте у них группы, которым их открыть.":"")+(upd?(nw?" ":"")+"Обновлено уже загруженных: "+upd+" (группы, ответы и результаты учеников сохранены).":"");if(window.SITE.refresh)window.SITE.refresh();render();},
        function(e){VT.msg="Не получилось: "+e.message;render();});
    return true;
  }
  return false;
}

/* ---------- запуск ---------- */
function init(){
  render();
  if(!window.claude||typeof window.claude.use!=="function"){
    S.fatal="Журнал работает только на странице claude.ai, где он опубликован."; render(); return;
  }
  var timer=setTimeout(function(){if(!(S.loaded.g&&S.loaded.l)){S.stale=true;render();}},10000);
  claude.use("db").then(function(db){
    if(!db){clearTimeout(timer);S.fatal="Не удалось открыть данные журнала. Войдите в claude.ai и откройте страницу снова.";render();return;}
    S.db=db;
    function fail(e){clearTimeout(timer);
      if(e&&e.code==="revoked"){S.fatal="Доступ к журналу закрыт.";}
      else S.notice="Связь с журналом прервалась. Обновите страницу.";
      render();}
    function settle(meta){if(S.loaded.g&&S.loaded.l&&!meta.fromCache){clearTimeout(timer);S.stale=false;}}
    db.collection("groups").onSnapshot(function(snap){
      S.groups=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());})
        .sort(function(a,b){return (a.order||0)-(b.order||0);});
      S.loaded.g=true; ensureGroup(); settle(snap.metadata); render();
    },fail);
    db.collection("lessons").onSnapshot(function(snap){
      S.lessons=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      S.loaded.l=true; settle(snap.metadata); render();
    },fail);
    if(window.SITE)db.collection("catalogs").onSnapshot(function(snap){
      S.cats=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).sort(function(a,b){return (a.order||0)-(b.order||0);});
      S.catsLoaded=true; if(S.mode==="catalog")render();
    },function(){S.catsLoaded=true;});
    if(window.SITE)db.collection("variants").onSnapshot(function(snap){
      S.vars=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}); if(S.mode==="variants")render();
    },function(){});
    if(window.SITE)db.collection("attempts").onSnapshot(function(snap){
      S.atts=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}); if(S.mode==="variants")render();
    },function(){});
    if(window.SITE)db.collection("submissions").onSnapshot(function(snap){
      S.subs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      render();
    },function(){});
  });
  claude.use("assets").then(function(a){S.assets=a||null;});
  claude.use("downloads").then(function(d){dl=d||null;}).catch(function(){});
  claude.use("user").then(function(u){
    if(!u)return;
    Promise.resolve(u.canEdit()).then(function(ok){if(ok===false){S.canWrite=false;render();}}).catch(function(){});
  });
}
init();
})();
</script>
