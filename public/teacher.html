<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Журнал групп</title>
<link rel="icon" href="/static/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: тетрадь в клетку. Шапка с группами, сводка «кто что не сдал», затем занятия карточками или таблицей */
  --paper:#f3f5f9; --surface:#ffffff; --text:#18202e; --muted:#5b6578; --line:#d8dfe9;
  --ink:#2446b8; --ink-soft:#e5ebfb; --on-ink:#ffffff;
  --ok:#17834a; --ok-soft:#dff3e7; --part:#9a6200; --part-soft:#fbefd6;
  --miss:#bd3618; --miss-soft:#fbe4dd; --wait:#5f6879; --wait-soft:#eaedf3;
  --grid:rgba(36,70,184,.07);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141c; --surface:#171d28; --text:#e5e9f1; --muted:#9ba5b6; --line:#2a3242;
    --ink:#8ea8ff; --ink-soft:#1d2849; --on-ink:#0c1120;
    --ok:#52c98a; --ok-soft:#153222; --part:#e6ae42; --part-soft:#3a2b0f;
    --miss:#ff8462; --miss-soft:#3e1d14; --wait:#a3acbc; --wait-soft:#232a37;
    --grid:rgba(142,168,255,.05);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10141c; --surface:#171d28; --text:#e5e9f1; --muted:#9ba5b6; --line:#2a3242;
  --ink:#8ea8ff; --ink-soft:#1d2849; --on-ink:#0c1120;
  --ok:#52c98a; --ok-soft:#153222; --part:#e6ae42; --part-soft:#3a2b0f;
  --miss:#ff8462; --miss-soft:#3e1d14; --wait:#a3acbc; --wait-soft:#232a37;
  --grid:rgba(142,168,255,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--text); font-family:var(--font-body); font-size:15px; line-height:1.5;
  min-height:100%;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
h2{font-family:var(--font-display);font-weight:500;font-size:16px;margin:0;text-wrap:balance}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.tab .n{color:var(--muted);font-weight:400;margin-left:4px}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.tab[aria-pressed="true"] .n{color:var(--on-ink);opacity:.75}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.empty{color:var(--muted);text-align:left}
.empty .btn{margin-top:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--miss);border-color:transparent;padding-left:0}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}
.notice{background:var(--part-soft);color:var(--text);border-radius:10px;padding:10px 14px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.hint-box{background:var(--ink-soft);border-radius:10px;padding:10px 14px;font-size:14px}

/* Сводка долгов */
.debts-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.debts-head .muted{font-size:14px}
.muted{color:var(--muted)}
.debt-row{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:10px;padding:8px 0;border-top:1px dashed var(--line);align-items:start}
.debt-row:first-of-type{border-top:none}
.debt-name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:none;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.none{background:var(--miss-soft);color:var(--miss)}
.chip.part{background:var(--part-soft);color:var(--part)}
.chip.wait{background:var(--wait-soft);color:var(--wait)}
.all-ok{color:var(--ok);font-weight:600}

/* Панель инструментов */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:none;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink-soft);color:var(--ink)}

/* Карточка занятия */
.lesson{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px;transition:box-shadow .3s}
.lesson.flash{box-shadow:0 0 0 3px var(--ink-soft)}
.l-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.l-date{font-family:var(--font-display);font-weight:500;font-size:16px}
.l-topic{font-weight:500;margin-top:2px}
.l-meta{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.hw{background:var(--paper);border-radius:8px;padding:10px 12px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:4px}
.hw-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px 4px 4px;color:var(--text);text-decoration:none;font-size:14px;max-width:100%}
.file:hover{border-color:var(--ink)}
.file img{width:40px;height:40px;object-fit:cover;border-radius:5px;display:block}
.file .ext{width:40px;height:40px;border-radius:5px;background:var(--ink-soft);color:var(--ink);display:grid;place-items:center;font-size:11px;font-weight:700;text-transform:uppercase;flex:none}
.file .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.marks{display:grid;grid-template-columns:minmax(120px,1fr) auto auto auto;column-gap:16px}
.score{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:14px;white-space:nowrap}
.sc-w{color:var(--muted)}
.sc-lbl{display:none}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 6px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;min-width:52px}
.sc:disabled{cursor:default}
.sc.good,.sc-t.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.sc.mid,.sc-t.mid{background:var(--part-soft);border-color:var(--part);color:var(--part);font-weight:600}
.sc.low,.sc-t.low{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);font-weight:600}
.period{display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.p-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.p-range label{color:var(--muted)}
.p-range input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px}
.p-count{margin-left:6px}
.period{position:relative}
.rp-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--text)}
.rp-btn svg{color:var(--ink)}
.rp-btn[aria-expanded="true"]{border-color:var(--ink)}
.rp-pop{position:absolute;left:16px;top:calc(100% - 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(10,14,22,.18);padding:14px;display:flex;flex-direction:column;gap:12px}
.rp-months{display:flex;gap:28px}
.rp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rp-title{font-weight:600}
.rp-nav{font-size:18px;line-height:1;padding:3px 10px}
.rp-nav-sp{width:36px}
.rp-grid{display:grid;grid-template-columns:repeat(7,38px);row-gap:3px}
.rp-wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.rp-day{height:36px;border:none;background:none;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums;position:relative;color:var(--text);border-radius:8px}
.rp-day:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.rp-day.in{background:var(--ink-soft);border-radius:0}
.rp-day.start,.rp-day.end{background:var(--ink);color:var(--on-ink);font-weight:700}
.rp-day.start{border-radius:8px 0 0 8px}
.rp-day.end{border-radius:0 8px 8px 0}
.rp-day.start.end{border-radius:8px}
.rp-day.today{font-weight:700;color:var(--ink)}
.rp-day.today.start,.rp-day.today.end{color:var(--on-ink)}
.rp-day.les::after,.rp-dot{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ok)}
.rp-day.start.les::after,.rp-day.end.les::after{background:var(--on-ink)}
.rp-dot{position:relative;display:inline-block;bottom:2px;left:0;margin:0 2px 0 0}
.rp-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rp-foot .hint{margin:0}
.rp-actions{display:flex;gap:8px}
@media (max-width:640px){
  .rp-pop{left:8px;right:8px}
  .rp-grid{grid-template-columns:repeat(7,1fr)}
}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tile{background:var(--paper);border-radius:10px;padding:10px 12px}
.t-label{font-size:13px;color:var(--muted)}
.t-val{font-family:var(--font-display);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.s-card{display:flex;flex-direction:column;gap:10px}
.s-row{display:grid;grid-template-columns:minmax(150px,200px) 1fr 52px 130px;gap:12px;align-items:center}
.s-label{font-size:14px;font-weight:500;display:flex;flex-direction:column}
.s-detail{font-size:12px;color:var(--muted);font-weight:400}
.bar{position:relative;height:12px;background:var(--wait-soft);border-radius:6px}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar-fill.f-att{background:var(--ok)} .bar-fill.f-hw{background:var(--ink)} .bar-fill.f-ok{background:var(--part)}
.bar-avg{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--text);border-radius:1px}
.s-val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.diff{font-size:13px;border-radius:999px;padding:2px 9px;justify-self:start;white-space:nowrap}
.diff.up{background:var(--ok-soft);color:var(--ok)} .diff.down{background:var(--miss-soft);color:var(--miss)}
.diff.same,.diff.none{background:var(--wait-soft);color:var(--wait)}
@media (max-width:600px){
  .tiles{gap:6px}
  .tile{padding:8px}
  .t-val{font-size:19px}
  .s-row{grid-template-columns:1fr 46px auto;gap:6px 10px}
  .s-label{grid-column:1/-1}
}
.sc.star,.sc-t.star{background:var(--ink-soft);border-color:var(--ink);color:var(--ink);font-weight:600}
.sc-t{font-size:12px;border-radius:5px;padding:1px 5px;font-variant-numeric:tabular-nums}
.modal input[type=number]{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.m-head,.m-row,.m-foot{grid-column:1/-1}
.m-head,.m-row{display:grid;grid-template-columns:subgrid;gap:8px 16px;align-items:center}
.m-head span,.m-row .opts{justify-self:start}
.m-head{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-bottom:6px}
.m-row{padding:6px 0;border-top:1px solid var(--line)}
.m-name{font-weight:500;overflow-wrap:anywhere}
.opts{display:inline-flex;gap:4px}
.m-foot .link{text-align:left}
.opt{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:14px;cursor:pointer;color:var(--muted)}
.opt:disabled{cursor:default}
.opt[aria-pressed="true"].yes{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt[aria-pressed="true"].no{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);font-weight:600}
.opt[aria-pressed="true"].half{background:var(--part-soft);border-color:var(--part);color:var(--part);font-weight:600}
.m-foot{display:flex;justify-content:flex-start;padding-top:8px}
@media (max-width:600px){
  .m-head{display:none}
  .marks{display:flex;flex-direction:column}
  .m-row{display:flex;flex-wrap:wrap;gap:6px 12px}
  .m-row .m-name{flex-basis:100%}
  .sc-lbl{display:inline}
  .debt-row{grid-template-columns:1fr}
}

/* Таблица */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
.grid-t thead th{position:sticky;top:0;background:var(--surface);z-index:1;color:var(--text);font-size:14px;border-bottom:2px solid var(--line);white-space:normal}
.grid-t thead th:first-child{border-top-left-radius:12px}
.grid-t thead th:last-child{border-top-right-radius:12px}
.grid-t th.c-date{text-align:left;width:1%;font-weight:500}
.c-topic{display:block;font-size:12px;color:var(--muted);font-weight:400;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.grid-t tr.sum th,.grid-t tr.sum td{background:var(--paper);font-weight:700;color:var(--text);padding:6px 8px}
.grid-t tr.sum th{font-weight:500;color:var(--muted);text-align:left}
.grid-t tr.sum.last th,.grid-t tr.sum.last td{border-bottom:2px solid var(--line)}
.grid-t tbody tr:last-child th,.grid-t tbody tr:last-child td{border-bottom:none}
.grid-t tbody tr:not(.sum):hover td,.grid-t tbody tr:not(.sum):hover th{background:var(--ink-soft)}
.th-date{background:none;border:none;color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;padding:0;text-decoration:underline dotted}
.cell{display:inline-grid;grid-template-columns:12px 16px;column-gap:6px;align-items:center;justify-items:center}
.cell.wide{grid-template-columns:12px 16px 38px}
.cell .c3{justify-self:start}
@media (max-width:600px){
  .table-wrap{overflow-x:auto}
  .grid-t thead th{position:static}
  .c-topic{display:none}
  th,td{padding:6px 2px}
  .grid-t th.c-date,.grid-t tr.sum th{padding-left:8px}
  .grid-t thead th{font-size:13px}
  .cell.wide{grid-template-columns:9px 12px 28px;column-gap:2px}
  .grid-t .sc-t{font-size:11px;padding:1px 3px}
  .grid-t .dot{width:8px;height:8px}
  .grid-t tr.sum td{font-size:13px}
  .grid-t tr.sum th{font-size:12px}
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:2px solid var(--line)}
.dot.y{background:var(--ok);border-color:var(--ok)}
.dot.n{background:transparent;border-color:var(--miss)}
.hm{font-weight:700;min-width:1.1em;display:inline-block}
.hm.done{color:var(--ok)} .hm.part{color:var(--part)} .hm.none{color:var(--miss)} .hm.wait{color:var(--wait)} .hm.nohw{color:var(--line)}
.stat{font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:10px 2px 0}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Окна */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:10}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.modal input[type=text],.modal input[type=date],.modal textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;width:100%}
.modal textarea{resize:vertical;min-height:110px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.m-files{display:flex;flex-direction:column;gap:6px}
.m-sec{display:flex;flex-direction:column;gap:10px}
.m-sec-t{font-family:var(--font-display);font-size:14px;font-weight:500;padding-top:6px;border-top:1px solid var(--line)}
.rec{background:var(--ink-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.rec .files{margin-top:0}
.rec-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.vid{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px 6px 6px;color:var(--text);text-decoration:none;font-weight:600}
.vid:hover{border-color:var(--ink)}
.vid-ico{width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:12px}
.vid-host{font-weight:400;color:var(--muted);font-size:13px}
.m-file{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px}
.m-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{color:var(--miss);font-size:14px;margin:0}
.err:empty{display:none}
.m-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:4px}
.m-actions .spacer{flex:1}
.g-edit{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.g-edit ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.g-edit li input{width:100%}
.s-line{display:flex;gap:6px;align-items:center}
.s-line input{flex:1}
.x:disabled{opacity:.35;cursor:default}
.x.mv{padding:4px 8px;font-size:14px;line-height:1}
.x{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--muted);font-size:13px}
.g-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.m-dirty.pulse{animation:pulse .3s ease}
.overlay{cursor:default}
.confirm{background:var(--miss-soft);border-radius:8px;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.file{cursor:pointer;font:inherit;text-align:left}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.close-x{flex:none;width:36px;height:36px;margin:-6px -8px 0 0;border:none;background:transparent;border-radius:8px;font-size:26px;line-height:1;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.close-x:hover{background:var(--paper);color:var(--text)}
.overlay.viewer{z-index:20;padding:12px}
.v-box{background:var(--surface);border-radius:14px;width:100%;max-width:1040px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.v-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:1}
.v-name{overflow-wrap:anywhere;font-weight:600;min-width:0;flex:1}
.v-btns{display:flex;gap:8px;align-items:center}
.v-body{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.v-img{max-width:100%;height:auto;border-radius:6px;display:block}
.v-page{max-width:100%;height:auto;box-shadow:0 1px 4px rgba(0,0,0,.2);background:#fff}
.v-text{white-space:pre-wrap;width:100%;margin:0;font-size:14px}
#v-err{padding:0 14px}
.site-links{display:flex;gap:14px;font-size:13px;flex-basis:100%;justify-content:flex-end}
.site-links .link{color:var(--muted)}
.top-btns{display:flex;gap:8px;flex-wrap:wrap}
.site-links{display:flex;gap:14px;font-size:13px;flex-basis:100%;justify-content:flex-end}
.site-links .link{color:var(--muted)}
.lk-g{font-weight:600}
.lk-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0;border-top:1px solid var(--line)}
.lk-row:first-of-type{border-top:none}
.lk-name{font-weight:500;min-width:90px}
.lk-url{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:5px 8px;font-size:13px}
.lk-btns{display:flex;gap:6px}
a.x{text-decoration:none;display:inline-flex;align-items:center}
.m-name{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.sub-b{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;cursor:pointer}
.sub-b.new{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.nw{border-left:4px solid var(--ink)}
.nw-chip{background:var(--ink-soft);color:var(--ink)}
.nw-chip:hover{background:var(--ink);color:var(--on-ink)}
.v-note{margin:0;padding:10px 14px;background:var(--ink-soft);white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="panel empty">Загружаю журнал…</div></main>
<div id="modal"></div>
<div id="viewer"></div>
<script src="/static/site-shim.js"></script>
<script>
(function(){
"use strict";
var S = {db:null, assets:null, canWrite:true, groups:[], lessons:[], subs:[], groupId:null, view:"list",
         loaded:{g:false,l:false}, stale:false, fatal:null, notice:null};
var M = null; // открытое окно
S.period = (function(){try{var v=JSON.parse(localStorage.getItem("tj-period")||"null");if(v&&v.preset)return v;}catch(e){}return {preset:"all"};})();
function savePeriod(){try{localStorage.setItem("tj-period",JSON.stringify(S.period));}catch(e){}}
var $ = function(s){return document.querySelector(s);};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function rid(){return Math.random().toString(36).slice(2,10);}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(s){var p=String(s||today()).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
var fLong=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"});
var fWd=new Intl.DateTimeFormat("ru-RU",{weekday:"short"});
function fmtLong(s){var d=parseD(s);return fLong.format(d)+", "+fWd.format(d);}
function fmtShort(s){var p=String(s||"").split("-");return p[2]+"."+p[1];}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

function curGroup(){for(var i=0;i<S.groups.length;i++)if(S.groups[i].id===S.groupId)return S.groups[i];return null;}
function groupLessons(gid){
  return S.lessons.filter(function(l){return l.groupId===gid;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.createdAt||0)-(a.createdAt||0);});
}
function mk(l,sid){return (l.marks||{})[sid]||{};}
function ensureGroup(){
  if(!curGroup()){var saved=store("tj-group");
    var g=S.groups.filter(function(x){return x.id===saved;})[0]||S.groups[0];
    S.groupId=g?g.id:null;}
}

/* ---------- запись: по одной на документ ---------- */
var queues={};
function write(path,fn){
  var run=function(){return fn().catch(function(e){
    if(e&&e.code==="unavailable")return new Promise(function(r){setTimeout(r,600+Math.random()*600);}).then(fn);
    throw e;});};
  queues[path]=(queues[path]||Promise.resolve()).then(run).catch(onWriteError);
  return queues[path];
}
function onWriteError(e){
  var c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"){S.canWrite=false;S.notice="Изменения не сохраняются: в этом просмотре журнал открыт только для чтения.";}
  else if(c==="quota_exceeded"){S.notice="Место в журнале закончилось. Удалите старые занятия или файлы и повторите.";}
  else{S.notice="Не получилось сохранить последнее изменение. Проверьте интернет и отметьте ещё раз.";}
  render();
}

/* ---------- отрисовка ---------- */
function render(){
  var h='<header class="top"><div><h1>Журнал групп</h1><p class="sub">Посещаемость и домашние задания</p></div>';
  if(S.db&&S.canWrite&&S.loaded.g)h+='<div class="top-btns">'+(S.groups.length?'<button class="btn ghost" data-action="links">Ссылки учеников</button>':'')+'<button class="btn ghost" data-action="groups">Группы и ученики</button></div>';
  h+='<div class="site-links"><button class="link" data-action="import">Перенос данных</button><button class="link" data-action="logout">Выйти</button></div>';
  if(!window.SITE&&S.db&&S.loaded.l&&dl)h+='<div class="site-links"><button class="link" data-action="export">Экспорт для переезда</button></div>';
  h+='</header>';
  if(S.notice)h+='<div class="notice" role="status"><span>'+esc(S.notice)+'</span><button class="link" data-action="dismiss">Закрыть</button></div>';
  if(S.fatal){$("#app").innerHTML=h+'<div class="panel empty">'+esc(S.fatal)+'</div>';return;}
  if(!(S.loaded.g&&S.loaded.l)){
    h+='<div class="panel empty">'+(S.stale?"Журнал пока не загрузился. Проверьте интернет: страница подтянет данные сама, как только связь появится.":"Загружаю журнал…")+'</div>';
    $("#app").innerHTML=h;return;
  }
  if(!S.groups.length){
    h+='<div class="panel empty">Групп пока нет.'+(S.canWrite?'<br><button class="btn" data-action="groups">Добавить группы и учеников</button>':'')+'</div>';
    $("#app").innerHTML=h;return;
  }
  var g=curGroup(), ls=groupLessons(g.id);
  h+='<nav class="tabs" aria-label="Группы">'+S.groups.map(function(x){
    return '<button class="tab" data-action="tab" data-g="'+esc(x.id)+'" aria-pressed="'+(x.id===g.id)+'">'+esc(x.name||"Без названия")+'<span class="n">· '+(x.students||[]).length+' уч.</span></button>';
  }).join("")+'</nav>';
  if((g.students||[]).some(function(s){return /^Ученик \d+$/.test(s.name);})&&S.canWrite)
    h+='<div class="hint-box">Впишите настоящие имена: кнопка «Группы и ученики» справа вверху.</div>';
  h+=renderNewWorks(g);
  h+=renderDebts(g,ls);
  h+='<div class="toolbar"><div class="seg" role="group" aria-label="Вид">'+
     '<button data-action="view" data-v="list" aria-pressed="'+(S.view==="list")+'">Занятия</button>'+
     '<button data-action="view" data-v="table" aria-pressed="'+(S.view==="table")+'">Таблица</button>'+
     '<button data-action="view" data-v="stats" aria-pressed="'+(S.view==="stats")+'">Статистика</button></div>'+
     (S.canWrite?'<button class="btn" data-action="new">+ Новое занятие</button>':'')+'</div>';
  if(!ls.length){
    h+='<div class="panel empty">В этой группе пока нет занятий. Добавьте первое: дата, тема, что задано и файл с заданием.</div>';
  } else if(S.view==="list"){
    h+=ls.map(function(l){return renderLesson(l,g);}).join("");
  } else {
    h+=S.view==="stats"?renderStats(g,ls):renderTable(g,ls);
  }
  $("#app").innerHTML=h;
}

function hwState(l,sid){var v=mk(l,sid).hw;return v==="done"||v==="part"||v==="none"?v:"wait";}
var HW_WORD={none:"не сдал(а)",part:"частично",wait:"ждём"};

function renderDebts(g,ls){
  var withHw=ls.filter(function(l){return !l.noHw;});
  var h='<section class="panel" aria-labelledby="debts-t"><div class="debts-head"><h2 id="debts-t">Кто что не сдал</h2>';
  if(!withHw.length){return h+'</div><p class="muted" style="margin:0">Когда появятся занятия с домашкой, здесь будет видно, от кого её ждать.</p></section>';}
  var rows=(g.students||[]).map(function(s){
    var d=withHw.filter(function(l){return hwState(l,s.id)!=="done";});
    return {s:s,d:d};
  }).filter(function(r){return r.d.length;});
  var total=rows.reduce(function(a,r){return a+r.d.length;},0);
  h+='<span class="muted">'+(total?total+" "+plural(total,"задание","задания","заданий")+" не сдано":"")+'</span></div>';
  if(!rows.length)return h+'<p class="all-ok" style="margin:0">Все всё сдали.</p></section>';
  h+=rows.map(function(r){
    return '<div class="debt-row"><div class="debt-name">'+esc(r.s.name)+'</div><div class="chips">'+
      r.d.map(function(l){var st=hwState(l,r.s.id);
        return '<button class="chip '+st+'" data-action="goto" data-l="'+esc(l.id)+'" title="Перейти к занятию">'+fmtShort(l.date)+' · '+HW_WORD[st]+'</button>';
      }).join("")+'</div></div>';
  }).join("");
  return h+'</section>';
}
function plural(n,a,b,c){var m=n%10,k=n%100;if(m===1&&k!==11)return a;if(m>=2&&m<=4&&(k<12||k>14))return b;return c;}

function fileUrl(f){return f.url||("/_blob/"+f.id);}
function extOf(n){var m=/\.([a-z0-9]{1,5})$/i.exec(n||"");return m?m[1]:"файл";}
function renderFiles(files,lid,which){
  if(!files||!files.length)return "";
  return '<div class="files">'+files.map(function(f,i){
    var isImg=/^image\//.test(f.type||"");
    return '<button type="button" class="file" data-action="open-file" data-l="'+esc(lid)+'" data-w="'+(which||"hw")+'" data-i="'+i+'" title="Открыть">'+
      (isImg?'<img src="'+esc(fileUrl(f))+'" alt="">':'<span class="ext">'+esc(extOf(f.name))+'</span>')+
      '<span class="fname">'+esc(f.name)+'</span></button>';
  }).join("")+'</div>';
}

/* ---------- просмотр файла внутри журнала ---------- */
var V=null, dl=null;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
var pdfReady=null;
function pdfLib(){
  if(!pdfReady){var base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    pdfReady=loadScript(base+"pdf.min.js").then(function(){return loadScript(base+"pdf.worker.min.js");}).then(function(){return window.pdfjsLib;});}
  return pdfReady;
}
function getBlob(f){return fetch(fileUrl(f),{credentials:"same-origin"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.blob();});}
function openFile(lid,i,which){
  var l=findLesson(lid), list=l?(which==="board"?l.board:l.files):null; if(!list||!list[i])return;
  V={files:list,i:+i}; renderViewer();
}
function normUrl(u){u=String(u||"").trim(); if(!u)return ""; if(!/^https?:\/\//i.test(u))u="https://"+u; return u;}
function hostOf(u){var m=/^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(u||"");return m?m[1]:"";}
function renderRec(l){
  var b=l.board||[];
  if(!l.video&&!b.length)return "";
  return '<div class="rec"><div class="label">Запись занятия</div>'+
    (l.video?'<a class="vid" href="'+esc(l.video)+'" target="_blank" rel="noopener"><span class="vid-ico" aria-hidden="true">▶</span>Смотреть видео<span class="vid-host">'+esc(hostOf(l.video))+'</span></a>':'')+
    (b.length?'<div class="rec-sub">Записи с доски</div>'+renderFiles(b,l.id,"board"):'')+'</div>';
}
/* ---------- работы учеников ---------- */
function subFor(lid,sid){for(var i=0;i<S.subs.length;i++){var x=S.subs[i];if(x.lessonId===lid&&x.studentId===sid)return x;}return null;}
function subUnseen(x){return !!x&&((x.files&&x.files.length)||x.comment)&&!(x.seenAt>=(x.updated||0));}
var fSubTime=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
function renderNewWorks(g){
  var names={};(g.students||[]).forEach(function(s){names[s.id]=s.name;});
  var list=S.subs.filter(function(x){return names[x.studentId]&&subUnseen(x)&&findLesson(x.lessonId);})
    .sort(function(a,b){return (b.updated||0)-(a.updated||0);});
  if(!list.length)return "";
  return '<section class="panel nw"><div class="debts-head"><h2>Новые работы</h2><span class="muted">'+list.length+' '+plural(list.length,"работа ждёт","работы ждут","работ ждут")+' проверки</span></div><div class="chips">'+
    list.map(function(x){var l=findLesson(x.lessonId), n=(x.files||[]).length;
      return '<button class="chip nw-chip" data-action="sub-open" data-l="'+esc(x.lessonId)+'" data-s="'+esc(x.studentId)+'">'+esc(names[x.studentId])+' · к '+fmtShort(l.date)+' · '+(n?n+' '+plural(n,"файл","файла","файлов"):"комментарий")+'</button>';
    }).join("")+'</div></section>';
}
function subButton(l,s){
  var x=subFor(l.id,s.id); if(!x||!((x.files&&x.files.length)||x.comment))return "";
  var n=(x.files||[]).length;
  return '<button class="sub-b'+(subUnseen(x)?' new':'')+'" data-action="sub-open" data-l="'+esc(l.id)+'" data-s="'+esc(s.id)+'">Решение'+(n?' · '+n+' '+plural(n,"файл","файла","файлов"):'')+'</button>';
}
function openSub(lid,sid){
  var x=subFor(lid,sid), l=findLesson(lid), g=curGroup(); if(!x)return;
  var st=(g&&g.students||[]).filter(function(s){return s.id===sid;})[0];
  var note=(st?st.name+' · ':'')+'к занятию '+(l?fmtLong(l.date):'')+' · прислано '+fSubTime.format(new Date(x.updated||Date.now()))+(x.comment?'\nКомментарий: '+x.comment:'');
  if(x.files&&x.files.length){V={files:x.files,i:0,note:note};renderViewer();}
  else{V={files:[{id:'',name:'Комментарий',type:'text/note'}],i:0,note:note};renderViewer();}
  if(subUnseen(x)){
    var now=Date.now(); x.seenAt=now; render();
    write("submissions/"+x.id,function(){return S.db.doc("submissions/"+x.id).update({seenAt:now});});
  }
}

function renderViewer(){
  var box=$("#viewer"); if(!V){box.innerHTML="";return;}
  var f=V.files[V.i], n=V.files.length;
  box.innerHTML='<div class="overlay viewer"><div class="v-box" role="dialog" aria-modal="true" aria-label="'+esc(f.name)+'">'+
    '<div class="v-bar"><span class="v-name">'+esc(f.name)+(n>1?' <span class="muted">('+(V.i+1)+' из '+n+')</span>':'')+'</span>'+
    '<span class="v-btns">'+(n>1?'<button class="x" data-action="v-prev" aria-label="Предыдущий файл">←</button><button class="x" data-action="v-next" aria-label="Следующий файл">→</button>':'')+
    (dl?'<button class="btn ghost" data-action="v-save">Скачать</button>':'')+
    '<button class="btn" data-action="v-close">Закрыть</button></span></div>'+
    (V.note?'<p class="v-note">'+esc(V.note)+'</p>':'')+
    '<p class="err" id="v-err"></p><div class="v-body" id="v-body"><p class="muted">Открываю…</p></div></div></div>';
  var body=$("#v-body"), my=V;
  var t=f.type||"";
  if(t==="text/note"){body.innerHTML='<p class="muted">Ученик прислал только комментарий, он показан выше.</p>';return;}
  if(/^image\//.test(t)){
    var img=new Image(); img.alt=f.name; img.className="v-img";
    img.onload=function(){if(V===my){body.innerHTML="";body.appendChild(img);}};
    img.onerror=function(){if(V===my)body.innerHTML='<p class="err">Картинку не удалось загрузить. Попробуйте обновить страницу.</p>';};
    img.src=fileUrl(f);
  } else if(/pdf/.test(t)||/\.pdf$/i.test(f.name)){
    Promise.all([pdfLib(),getBlob(f).then(function(b){return b.arrayBuffer();})]).then(function(r){
      return r[0].getDocument({data:new Uint8Array(r[1])}).promise;
    }).then(function(pdf){
      if(V!==my)return; body.innerHTML="";
      var w=Math.min(body.clientWidth||800,1000), chain=Promise.resolve();
      for(var p=1;p<=pdf.numPages;p++)(function(p){chain=chain.then(function(){
        if(V!==my)return;
        return pdf.getPage(p).then(function(page){
          var vp0=page.getViewport({scale:1}), scale=w/vp0.width, dpr=window.devicePixelRatio||1;
          var vp=page.getViewport({scale:scale*dpr}), c=document.createElement("canvas");
          c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+"px";c.className="v-page";
          body.appendChild(c);
          return page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        });});})(p);
      return chain;
    }).catch(function(){if(V===my)body.innerHTML='<p class="err">PDF не удалось показать здесь.'+(dl?' Нажмите «Скачать», чтобы открыть его на устройстве.':'')+'</p>';});
  } else {
    getBlob(f).then(function(b){return b.text();}).then(function(txt){
      if(V!==my)return; var pre=document.createElement("pre");pre.className="v-text";pre.textContent=txt;body.innerHTML="";body.appendChild(pre);
    }).catch(function(){if(V===my)body.innerHTML='<p class="err">Файл не удалось открыть.</p>';});
  }
}
var EXT_BY_TYPE={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","application/pdf":"pdf","text/plain":"txt","text/csv":"csv","text/markdown":"md"};
function saveFile(){
  var f=V.files[V.i], name=f.name, ex=(EXT_BY_TYPE[f.type]||"");
  if(!/\.(gif|png|jpe?g|webp|txt|json|md|csv|pdf|svg)$/i.test(name))name=name.replace(/\.[^.]*$/,"")+"."+(ex||"txt");
  var e=$("#v-err"); if(e)e.textContent="";
  getBlob(f).then(function(b){return dl.save({filename:name,data:b});}).catch(function(err){
    if(err&&err.code==="declined")return;
    var e2=$("#v-err"); if(e2)e2.textContent="Скачать не получилось. Попробуйте ещё раз.";
  });
}

function renderLesson(l,g){
  var st=g.students||[];
  var present=st.filter(function(s){return mk(l,s.id).att==="y";}).length;
  var done=st.filter(function(s){return mk(l,s.id).hw==="done";}).length;
  var meta="Были "+present+" из "+st.length+(l.noHw?"":" · ДЗ сдали "+done+" из "+st.length);
  var cnt=hasCount(l);
  if(cnt){var sOk=0,sN=0;st.forEach(function(s){var o=okOf(l,s.id);if(o!=null){sOk+=o;sN+=cnt;}});
    meta+=" · в ДЗ "+cnt+" "+plural(cnt,"номер","номера","номеров")+(sN?", верно "+sOk+" из "+sN+" ("+Math.round(sOk/sN*100)+"%)":"");}
  var h='<article class="lesson" id="l-'+esc(l.id)+'"><div class="l-head"><div><div class="l-date">'+esc(fmtLong(l.date))+'</div>'+
    (l.topic?'<div class="l-topic">'+esc(l.topic)+'</div>':'')+'<div class="l-meta">'+meta+'</div></div>'+
    (S.canWrite?'<button class="btn ghost" data-action="edit" data-l="'+esc(l.id)+'">Изменить</button>':'')+'</div>';
  h+=renderRec(l);
  if(l.noHw){h+='<div class="hw"><p class="hw-text muted">Домашку не задавали</p></div>';}
  else{
    h+='<div class="hw"><div class="label">Домашнее задание</div>'+
      (l.hw?'<p class="hw-text">'+esc(l.hw)+'</p>':'<p class="hw-text muted">Текст задания не записан</p>')+
      renderFiles(l.files,l.id)+'</div>';
  }
  if(!st.length){return h+'<p class="muted" style="margin:0">В группе нет учеников.</p></article>';}
  var dis=S.canWrite?"":" disabled";
  function ob(kind,s,v,label,cls,cur){

function hasCount(l){var n=parseInt(l.count,10);return !l.noHw&&n>0?n:0;}
function okOf(l,sid){var o=mk(l,sid).ok;var n=hasCount(l);return typeof o==="number"&&n?Math.min(o,n+2):null;}
function scoreCls(ok,n){if(ok==null||!n)return "";var r=ok/n;return r>1?"star":r>=1?"good":r>=0.5?"mid":"low";}

/* ---------- статистика ---------- */
function studentStats(ls,sid){
  var a={y:0,n:0}, h={sum:0,n:0,done:0,part:0,none:0}, o={ok:0,n:0};
  ls.forEach(function(l){var m=mk(l,sid);
    if(m.att==="y")a.y++; else if(m.att==="n")a.n++;
    if(!l.noHw&&(m.hw==="done"||m.hw==="part"||m.hw==="none")){h.n++;h[m.hw]++;h.sum+=m.hw==="done"?1:m.hw==="part"?0.5:0;}
    var ok=okOf(l,sid); if(ok!=null){o.ok+=ok;o.n+=hasCount(l);}
  });
  return {
    att:{v:(a.y+a.n)?a.y/(a.y+a.n)*100:null, d:"был на "+a.y+" из "+(a.y+a.n)},
    hw:{v:h.n?h.sum/h.n*100:null, d:h.done+" сдано"+(h.part?", "+h.part+" частично":"")+(h.none?", "+h.none+" не сдано":"")},
    ok:{v:o.n?o.ok/o.n*100:null, d:o.ok+" из "+o.n+" "+plural(o.n,"номера","номеров","номеров")}
  };
}
var METRICS=[["att","Посещаемость"],["hw","Сдача ДЗ"],["ok","Верно решено"]];
function isoD(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function periodRange(){

  return {from:"",to:""};
}
var P={open:false,y:0,m:0,a:null,hov:null};
var MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var MON_G=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function rpWide(){return (window.innerWidth||800)>640;}
function fmtD(iso,withYear){var d=parseD(iso);return d.getDate()+" "+MON_G[d.getMonth()]+(withYear?" "+d.getFullYear():"");}
function fmtRange(r){
  if(!r.from&&!r.to)return "Весь период";
  if(r.from&&r.to){
    if(r.from===r.to)return fmtD(r.from,true);
    var sameY=r.from.slice(0,4)===r.to.slice(0,4);
    return fmtD(r.from,!sameY)+" — "+fmtD(r.to,true);
  }
  return r.from?"с "+fmtD(r.from,true):"по "+fmtD(r.to,true);
}
function rpBounds(){
  if(P.a){var b=P.hov||P.a;return P.a<=b?{from:P.a,to:b}:{from:b,to:P.a};}
  var r=periodRange();return (r.from&&r.to)?r:{from:r.from||"",to:r.to||""};
}
function rpDayCls(iso,bd){
  var c="";
  if(bd.from&&bd.to&&iso>bd.from&&iso<bd.to)c+=" in";
  if(iso===bd.from)c+=" start";
  if(iso===bd.to)c+=" end";
  return c;
}
function rpMonth(y,m,les,showPrev,showNext){

  for(var i=0;i<off;i++)h+='<span></span>';

function rpPaint(){

function rpOpen(){

function renderStats(g,allLs){
  var r=periodRange();

  var top=renderPeriod(ls.length,allLs);

  return top+renderStatsBody(g,ls);

function renderStatsBody(g,ls){
  var st=g.students||[];
  var all=st.map(function(s){return {s:s,x:studentStats(ls,s.id)};});
  var avg={}, scale={};
  METRICS.forEach(function(mt){var k=mt[0], vals=all.map(function(r){return r.x[k].v;}).filter(function(v){return v!=null;});
    avg[k]=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
    scale[k]=Math.max(100,Math.max.apply(null,vals.concat([0])));});
  function pct(v){return v==null?"—":Math.round(v)+"%";}
  var h='<section class="panel"><h2>В среднем по группе</h2><div class="tiles">'+
    METRICS.map(function(mt){return '<div class="tile"><div class="t-label">'+mt[1]+'</div><div class="t-val">'+pct(avg[mt[0]])+'</div></div>';}).join("")+
    '</div></section>';
  h+=all.map(function(r){
    return '<section class="panel s-card"><h2 class="s-name">'+esc(r.s.name)+'</h2>'+
      METRICS.map(function(mt){var k=mt[0], v=r.x[k].v, a=avg[k], sc=scale[k];
        var diff='', bar='';
        if(v==null){diff='<span class="diff none">нет данных</span>';}
        else{
          var d=Math.round(v-(a==null?v:a));
          diff=Math.abs(d)<3?'<span class="diff same">как в среднем</span>':d>0?'<span class="diff up">выше на '+d+'%</span>':'<span class="diff down">ниже на '+(-d)+'%</span>';
          bar='<span class="bar-fill f-'+k+'" style="width:'+Math.min(100,v/sc*100).toFixed(1)+'%"></span>';
        }
        var tick=a==null?'':'<span class="bar-avg" style="left:'+Math.min(100,a/sc*100).toFixed(1)+'%" title="Среднее по группе: '+pct(a)+'"></span>';
        return '<div class="s-row"><div class="s-label">'+mt[1]+'<span class="s-detail">'+(v==null?'':esc(r.x[k].d))+'</span></div>'+
          '<div class="bar" role="img" aria-label="'+mt[1]+': '+pct(v)+', в среднем по группе '+pct(a)+'">'+bar+tick+'</div>'+
          '<div class="s-val">'+pct(v)+'</div>'+diff+'</div>';
      }).join("")+'</section>';
  }).join("");
  h+='<p class="hint">Считаются только отмеченные занятия. Посещаемость: сколько раз «был» из всех отметок «был / не был». Сдача ДЗ: «частично» идёт за половину, домашки без отметки («ждём») не учитываются. Верно решено: по домашкам, где указано число номеров; задачи со звёздочкой могут дать больше 100%. Тёмная черта на полосе — среднее по группе.</p>';
  return h;
}

    '</div></div>';
  return h;

/* ---------- экспорт для переезда на свой сайт ---------- */
var CRC_T=null;
function crc32(u8){
  if(!CRC_T){CRC_T=new Uint32Array(256);for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;CRC_T[n]=c>>>0;}}
  var crc=0xFFFFFFFF;for(var i=0;i<u8.length;i++)crc=CRC_T[(crc^u8[i])&0xFF]^(crc>>>8);return (crc^0xFFFFFFFF)>>>0;
}
function zipBuild(entries){ // entries: [{name, data:Uint8Array}] — без сжатия
  var parts=[], central=[], offset=0, enc=new TextEncoder();
  entries.forEach(function(e){
    var name=enc.encode(e.name), crc=crc32(e.data), size=e.data.length;
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint32(14,crc,true);h.setUint32(18,size,true);h.setUint32(22,size,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,name,e.data);
    var c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);
    c.setUint32(42,offset,true);
    central.push(c.buffer,name);
    offset+=30+name.length+size;
  });
  var cdSize=central.reduce(function(a,b){return a+(b.byteLength||b.length);},0);
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);
  end.setUint32(12,cdSize,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[end.buffer]),{type:"application/zip"});
}

    '<p>Соберу все группы, занятия, отметки и файлы в один архив. Его нужно будет загрузить на вашем сайте в разделе «Перенос данных».</p>'+
    '<p class="hint" id="ex-status">Файлов много, сборка займёт пару минут. Не закрывайте страницу.</p>'+
    '<div class="m-actions"><span class="spacer"></span><button class="btn ghost" data-action="m-close">Отмена</button><button class="btn" id="ex-go" data-action="ex-go">Собрать архив</button></div></div></div>';
}
function doExport(){
  var st=$("#ex-status"), go=$("#ex-go"); M.busy=true; go.disabled=true;
  var meta={}, list=[];
  S.lessons.forEach(function(l){(l.files||[]).concat(l.board||[]).forEach(function(f){if(f&&f.id&&!meta[f.id]){meta[f.id]={name:f.name,type:f.type||""};list.push(f);}});});
  var entries=[], failed=0, i=0;
  function next(){
    if(!M||M.kind!=="export")return;
    if(i>=list.length)return finish();
    var f=list[i++]; st.textContent="Собираю файлы: "+i+" из "+list.length+"…";
    getBlob(f).then(function(b){return b.arrayBuffer();}).then(function(ab){entries.push({name:"files/"+f.id,data:new Uint8Array(ab)});},
      function(){failed++;delete meta[f.id];}).then(next);
  }
  function finish(){
    var data={version:1,exported:new Date().toISOString(),
      groups:S.groups.map(function(g){var d=Object.assign({},g);delete d.id;return {id:g.id,data:d};}),
      lessons:S.lessons.map(function(l){var d=Object.assign({},l);delete d.id;return {id:l.id,data:d};}),
      files:meta};
    entries.unshift({name:"data.json",data:new TextEncoder().encode(JSON.stringify(data))});
    st.textContent="Упаковываю архив…";
    setTimeout(function(){
      var blob=zipBuild(entries), d=new Date();
      var name="журнал-экспорт-"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".zip";
      dl.save({filename:name,data:blob}).then(function(){
        st.textContent="Готово: архив сохранён ("+Math.round(blob.size/1048576)+" МБ, файлов "+(entries.length-1)+")."+(failed?" Не удалось забрать файлов: "+failed+".":"");
        M.busy=false;
      },function(e){M.busy=false;go.disabled=false;st.textContent=e&&e.code==="declined"?"Сохранение отменено. Нажмите «Собрать архив» ещё раз.":"Не получилось сохранить архив. Попробуйте ещё раз.";});
    },50);
  }
  next();
}

/* ---------- ссылки учеников ---------- */
var LINKS=null;
function linkUrl(t){return location.origin+"/s/"+t;}
function openLinks(){
  M={kind:"links",confirm:null}; LINKS=null; renderLinks();
  window.SITE.api("GET","/api/links").then(function(j){LINKS=j.links||{};if(M&&M.kind==="links")renderLinks();},
    function(){LINKS={};if(M&&M.kind==="links")renderLinks("Не удалось загрузить ссылки. Проверьте интернет.");});
}
function renderLinks(err){
  var h='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lk-title"><div class="m-top"><h2 id="lk-title">Ссылки учеников</h2>'+
    '<button type="button" class="close-x" data-action="m-close" aria-label="Закрыть" title="Закрыть">×</button></div>'+
    '<p class="hint">У каждого ученика своя ссылка на личный кабинет, пароль не нужен. Кто откроет ссылку, увидит кабинет этого ученика, поэтому отправляйте её лично. Если ссылка попала не туда, нажмите «Новая ссылка»: старая сразу перестанет работать.</p>';
  if(err)h+='<p class="err">'+esc(err)+'</p>';
  if(!LINKS)h+='<p class="muted">Загружаю…</p>';
  else h+=S.groups.map(function(g){
    return '<section class="g-edit"><div class="lk-g">'+esc(g.name)+'</div>'+((g.students||[]).map(function(s){
      var t=LINKS[s.id];
      var row='<div class="lk-row"><span class="lk-name">'+esc(s.name)+'</span>';
      if(!t)row+='<button class="btn ghost" data-action="lk-make" data-s="'+esc(s.id)+'">Создать ссылку</button>';
      else{
        row+='<input class="lk-url" readonly value="'+esc(linkUrl(t))+'" aria-label="Ссылка: '+esc(s.name)+'">'+
          '<span class="lk-btns"><button class="x" data-action="lk-copy" data-s="'+esc(s.id)+'">Скопировать</button>'+
          '<a class="x" href="'+esc(linkUrl(t))+'" target="_blank" rel="noopener noreferrer">Открыть</a>'+
          '<button class="x" data-action="lk-new" data-s="'+esc(s.id)+'">Новая ссылка</button></span>';
        if(M.confirm===s.id)row+='<div class="confirm" style="flex-basis:100%">Старая ссылка перестанет работать. Сделать новую?<button class="btn" data-action="lk-new-yes" data-s="'+esc(s.id)+'">Да, новая ссылка</button><button class="link" data-action="lk-new-no">Отмена</button></div>';
      }
      return row+'</div>';
    }).join("")||'<p class="muted" style="margin:0">В группе нет учеников.</p>')+'</section>';
  }).join("");
  h+='<div class="m-actions"><span class="spacer"></span><button class="btn" data-action="m-close">Готово</button></div></div></div>';
  $("#modal").innerHTML=h;
}
function makeLink(sid,regen){
  window.SITE.api("POST","/api/links/"+encodeURIComponent(sid)+(regen?"?new=1":"")).then(function(j){
    LINKS[sid]=j.token; if(M&&M.kind==="links"){M.confirm=null;renderLinks();}
  },function(){if(M&&M.kind==="links")renderLinks("Не получилось создать ссылку. Проверьте интернет.");});
}
function copyLink(sid,btn){
  var t=LINKS&&LINKS[sid]; if(!t)return;
  var url=linkUrl(t), inp=btn.closest(".lk-row").querySelector(".lk-url");
  function done(){btn.textContent="Скопировано";setTimeout(function(){btn.textContent="Скопировать";},1500);}
  function fallback(){inp.focus();inp.select();try{document.execCommand("copy");done();}catch(e){}}
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(url).then(done,fallback); else fallback();
}

/* ---------- перенос данных ---------- */
function openImport(){
  M={kind:"import",busy:false};
  $("#modal").innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="im-title"><div class="m-top"><h2 id="im-title">Перенос данных из журнала на Claude</h2>'+
    '<button type="button" class="close-x" data-action="m-close" aria-label="Закрыть" title="Закрыть">×</button></div>'+
    '<p>Выберите архив, скачанный кнопкой <b>«Экспорт для переезда»</b> в журнале на Claude.</p>'+
    '<p class="confirm" style="display:block">Все группы, занятия и отметки на этом сайте будут заменены данными из архива. Ссылки учеников сохранятся.</p>'+
    '<input type="file" id="im-file" accept=".zip,application/zip">'+
    '<p class="hint" id="im-status"></p>'+
    '<div class="m-actions"><span class="spacer"></span><button class="btn ghost" data-action="m-close">Отмена</button><button class="btn" id="im-go" data-action="im-go">Загрузить</button></div></div></div>';
}
function doImport(){
  var f=$("#im-file").files[0], st=$("#im-status"), go=$("#im-go");
  if(!f){st.textContent="Сначала выберите архив.";return;}
  M.busy=true; go.disabled=true; st.textContent="Загружаю архив ("+Math.round(f.size/1048576)+" МБ). Это может занять несколько минут, не закрывайте страницу…";
  fetch("/api/import",{method:"POST",credentials:"same-origin",headers:{"X-Journal":"1","Content-Type":"application/zip"},body:f})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Ошибка "+r.status));return j;});})
    .then(function(j){st.textContent="Готово: групп "+j.groups+", занятий "+j.lessons+", файлов "+j.files+". Обновляю страницу…";setTimeout(function(){location.reload();},1500);})
    .catch(function(e){M.busy=false;go.disabled=false;st.textContent="Не получилось: "+e.message;});
}

/* ---------- запуск ---------- */
function init(){
  render();
  if(!window.claude||typeof window.claude.use!=="function"){
    S.fatal="Журнал работает только на странице claude.ai, где он опубликован."; render(); return;
  }
  var timer=setTimeout(function(){if(!(S.loaded.g&&S.loaded.l)){S.stale=true;render();}},10000);
  claude.use("db").then(function(db){
    if(!db){clearTimeout(timer);S.fatal="Не удалось открыть данные журнала. Войдите в claude.ai и откройте страницу снова.";render();return;}
    S.db=db;
    function fail(e){clearTimeout(timer);
      if(e&&e.code==="revoked"){S.fatal="Доступ к журналу закрыт.";}
      else S.notice="Связь с журналом прервалась. Обновите страницу.";
      render();}
    function settle(meta){if(S.loaded.g&&S.loaded.l&&!meta.fromCache){clearTimeout(timer);S.stale=false;}}
    db.collection("groups").onSnapshot(function(snap){
      S.groups=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());})
        .sort(function(a,b){return (a.order||0)-(b.order||0);});
      S.loaded.g=true; ensureGroup(); settle(snap.metadata); render();
    },fail);
    db.collection("lessons").onSnapshot(function(snap){
      S.lessons=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      S.loaded.l=true; settle(snap.metadata); render();
    },fail);
    if(window.SITE)db.collection("submissions").onSnapshot(function(snap){
      S.subs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      render();
    },function(){});
  });
  claude.use("assets").then(function(a){S.assets=a||null;});
  claude.use("downloads").then(function(d){dl=d||null;}).catch(function(){});
  claude.use("user").then(function(u){
    if(!u)return;
    Promise.resolve(u.canEdit()).then(function(ok){if(ok===false){S.canWrite=false;render();}}).catch(function(){});
  });
}
init();
})();
</script>
